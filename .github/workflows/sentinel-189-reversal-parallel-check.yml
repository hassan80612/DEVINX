name: Sentinel 189 reversal vs impulse candidate checks
on:
  push:
    branches:
      - fix/sentinel-189-reversal-vs-impulse-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-without-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source syntax
        run: node --check sentinel-trading-lab/agent/src/core/historical-extreme-timing.mjs
      - name: Check reversal, 30s, expiry, side and click regressions
        run: |
          node --test --test-concurrency=4 tests/sentinel-188-extreme-reversal-timing.test.mjs tests/sentinel-189-5m-reversal-parallel.test.mjs tests/sentinel-187-blitz-and-impulse.test.mjs tests/sentinel-189-native-expiry-and-last-turn.test.mjs tests/sentinel-185-prior-candle-breach.test.mjs tests/sentinel-185-final-turn-veto.test.mjs tests/sentinel-182-entry-family.test.mjs
