name: Sentinel shared base directional A/B validation — NO DEPLOY
on:
  push:
    branches: [fix/sentinel-shared-base-direction-single-20261015]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install existing agent dependencies
        run: npm install --prefix sentinel-trading-lab/agent --omit=dev --no-audit --no-fund
      - name: One signal, broker-price causality, 30s/60s and legacy regression
        run: node --test tests/sentinel-shared-base-v2.test.mjs tests/sentinel-now-expiry-one-shot.test.mjs tests/sentinel-1398-range-structure-regression.test.mjs
      - name: Chronological A/B shared base against deployed engine
        run: node tests/sentinel-shared-base-v2-ab.mjs
