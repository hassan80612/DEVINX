name: Sentinel Expiry 30s Rollback Regression
on:
  push:
    branches:
      - fix/sentinel-244-expiry-persistence-native-20261103
  pull_request:
    branches:
      - fix/sentinel-244-match-243-exe-headers-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Agent test dependencies
        run: npm install --prefix sentinel-trading-lab/agent --ignore-scripts --no-audit --no-fund
      - name: Verify expiry isolation and no 30s fallback
        run: |
          set -euo pipefail
          node --check sentinel-trading-lab/agent/worker/index.mjs
          node --check sentinel-trading-lab/agent/worker/broker-native-expiry-keeper.mjs
          node --test tests/sentinel-245-rollback-30s-recovery.test.mjs tests/sentinel-221-expiry-native-durable.test.mjs
