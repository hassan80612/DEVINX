name: Sentinel Source Normalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sentinel-source-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack current site and Agent source
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          rm -rf normalized
          mkdir -p normalized/app normalized/agent
          cat app-bundle.b64.* | tr -d '\n' | base64 -d > /tmp/sentinel-app.tar.gz
          tar -xzf /tmp/sentinel-app.tar.gz -C normalized/app
          unzip -q public/downloads/agent_payload_v87.zip -d normalized/agent
          rm -rf normalized/app/.next normalized/app/node_modules normalized/agent/node_modules
          echo "APP FILES"
          find normalized/app -maxdepth 4 -type f | sort
          echo "AGENT FILES"
          find normalized/agent -maxdepth 4 -type f | sort
      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel-trading-lab/normalized
          if git diff --cached --quiet; then
            echo "Normalized source already current."
            exit 0
          fi
          git commit -m 'chore(sentinel): expose normalized site and Agent source'
          git pull --rebase origin main
          git push
