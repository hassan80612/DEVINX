name: Financeiro one-pass auth and access verification
on:
  push:
    branches: [fix/financeiro-auth-single-release-20261015]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck Financeiro
        run: npm run typecheck
      - name: Validate auth paths
        run: node --test tests/financeiro-20261015-access-error.test.mjs
