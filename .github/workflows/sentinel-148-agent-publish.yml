name: Sentinel Agent v148 package

on:
  push:
    branches:
      - codex/sentinel-v47-entry-flow-labels-20261028
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/agent-launcher.go'
      - 'sentinel-trading-lab/package.json'
      - 'sentinel-trading-lab/public/downloads/install-agent-v88.ps1'
      - '.github/workflows/sentinel-148-agent-publish.yml'

permissions:
  contents: write

concurrency:
  group: sentinel-v148-agent-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Check Agent syntax and release identity
        shell: bash
        run: |
          set -euo pipefail
          find sentinel-trading-lab/agent -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('sentinel-trading-lab')
          release=json.loads((root/'agent/release.json').read_text())
          package=json.loads((root/'agent/package.json').read_text())
          lock=json.loads((root/'agent/package-lock.json').read_text())
          assert release['version']=='13.9.148', release
          assert release['publicVersion']=='13.9.148', release
          assert package['version']==release['version']
          assert lock['version']==release['version']
          assert lock['packages']['']['version']==release['version']
          print('Agent source identity verified:',release['version'],release['build'])
          PY
      - name: Build the update ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          mkdir -p public/downloads
          rm -f public/downloads/agent_payload_v88.zip
          (
            cd agent
            zip -qr ../public/downloads/agent_payload_v88.zip . \
              -x 'node_modules/*' 'worker/data/*' '*.log' '.DS_Store'
          )
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('.')
          release=json.loads((root/'agent/release.json').read_text())
          payload=(root/'public/downloads/agent_payload_v88.zip').read_bytes()
          manifest={
            'format':'sentinel-agent-update-v1',
            'version':release['version'],
            'build':release['build'],
            'zipSha256':hashlib.sha256(payload).hexdigest()
          }
          (root/'public/downloads/agent-update.json').write_text(
            json.dumps(manifest,separators=(',',':'))+chr(10)
          )
          print('Update package prepared:',manifest['version'],len(payload),manifest['zipSha256'])
          PY
      - name: Build the Windows Agent installer
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico agent/worker/sentinel.ico -arch amd64 -o sentinel_icon.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o public/downloads/Sentinel-Agent-Windows.exe agent-launcher.go
          rm -f sentinel_icon.syso
          cp public/downloads/Sentinel-Agent-Windows.exe public/downloads/sentinel-agent-windows.exe
          test "$(stat -c%s public/downloads/Sentinel-Agent-Windows.exe)" -gt "$(stat -c%s public/downloads/agent_payload_v88.zip)"
          file public/downloads/Sentinel-Agent-Windows.exe
      - name: Commit generated v148 downloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe \
            sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe \
            sentinel-trading-lab/public/downloads/agent_payload_v88.zip \
            sentinel-trading-lab/public/downloads/agent-update.json
          if git diff --cached --quiet; then
            echo 'Generated v148 downloads already match source.'
            exit 0
          fi
          git commit -m 'build(sentinel): package Windows Agent 13.9.148'
          git push origin HEAD:codex/sentinel-v47-entry-flow-labels-20261028
