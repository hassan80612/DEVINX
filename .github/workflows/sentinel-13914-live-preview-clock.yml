name: Sentinel 13.9.18 PC layout and mobile parity - NO PRODUCTION DEPLOY
on:
  push:
    branches: [fix/sentinel-pc-layout-only-20261015]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
      - name: Install web dependencies
        working-directory: sentinel-trading-lab
        run: npm install --no-audit --no-fund
      - name: Validate original regressions, current strategy and first post-expiry quote; compile embedded Agent
        working-directory: sentinel-trading-lab
        run: npm run prebuild
      - name: Validate curated strategy list, Automatic parity, translations, expiry and mobile requirements
        run: node --test tests/sentinel-five-strategies-mobile-guide.test.mjs tests/sentinel-shared-base-v2.test.mjs tests/sentinel-13915-one-pass.test.mjs
      - name: Compare 30-second outcome learning with deployed baseline (research, not market proof)
        run: node tests/sentinel-shared-base-v2-ab.mjs
      - name: Verify compact PC layout, expanded mobile details, signed PC-to-mobile parity
        run: node --test tests/sentinel-pc-visual-mobile-parity-20261015.test.mjs tests/sentinel-67315-mobile-integrity.test.mjs tests/sentinel-mobile-event-pc-fidelity-6723.test.mjs tests/sentinel-mobile-low-latency-1357.test.mjs
      - name: Typecheck actual site
        working-directory: sentinel-trading-lab
        run: npx tsc --noEmit
      - name: Install test browser and validate actual PC overlay
        run: |
          node sentinel-trading-lab/agent/node_modules/playwright-core/cli.js install --with-deps chromium
          node scripts/sentinel-13914-overlay-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-13.9.18-Windows
          path: sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe
          retention-days: 5
  windows-payload:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sentinel-13.9.17-Windows
          path: candidate
      - name: Run actual Windows executable and verify its embedded release without installing
        shell: pwsh
        env:
          SENTINEL_INSTALL_VERIFY_ONLY: '1'
          SENTINEL_INSTALL_TEST: '1'
          CI: 'true'
        run: |
          $ErrorActionPreference='Stop'
          & ./candidate/Sentinel-Agent-Windows.exe
          if($LASTEXITCODE -ne 0){throw "Embedded Agent verification failed: $LASTEXITCODE"}
