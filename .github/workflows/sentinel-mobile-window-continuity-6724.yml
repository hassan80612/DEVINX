name: Sentinel 67.24 Mobile Window Continuity
on:
  push:
    branches: [fix/sentinel-6724-mobile-window-flicker-20261013]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm Windows Agent and motor are unchanged
        run: |
          node -e "if(require('./sentinel-trading-lab/agent/release.json').version!=='13.4.67.24')process.exit(1)"
          node --check sentinel-trading-lab/src/lib/signed-pc-window-order.mjs
          node --check sentinel-trading-lab/src/lib/pc-authoritative-window.mjs
      - name: Verify no blank at rollover, signed event order and previous regressions
        run: |
          node --test tests/sentinel-6724-mobile-no-blank-window.test.mjs tests/sentinel-mobile-canonical-window-6723.test.mjs tests/sentinel-mobile-event-pc-fidelity-6723.test.mjs tests/sentinel-pc-mobile-signed-clock-6724.test.mjs tests/sentinel-mobile-pc-channel-parity-6721.test.mjs tests/sentinel-source-event-pc-mobile-6722.test.mjs tests/sentinel-live-bridge.test.mjs
      - name: Typecheck and compile mobile/web only
        working-directory: sentinel-trading-lab
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run build
