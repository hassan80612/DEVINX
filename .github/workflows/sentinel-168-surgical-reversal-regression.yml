name: Sentinel 168 surgical reversal regression
on:
  push:
    branches:
      - fix/sentinel-168-confirmed-fast-reversal-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Focused reversal and expiry regression
        run: |
          node --test tests/sentinel-168-verified-fast-reversal-20261029.test.mjs tests/sentinel-168-rebuilt-160.test.mjs tests/sentinel-fast-level-reversal-121.test.mjs tests/sentinel-166-expiry-reload.test.mjs tests/sentinel-167-expiry-preference.test.mjs tests/sentinel-139146-reversals-only-5m.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Full unit regression (existing legacy failures may be present)
        run: npm test
  baseline-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 569375cdfc00ab57d451919d10127501c8145016
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Compare full suite on unmodified preserved 168
        shell: bash
        run: |
          npm test > /tmp/sentinel-168-original-suite.log 2>&1 || true
          grep -E '^ℹ (tests|pass|fail|cancelled|skipped)' /tmp/sentinel-168-original-suite.log | tail -n 8
