name: Sentinel 13.9.106 market-base validation NO DEPLOY
on:
  push:
    branches:
      - fix/sentinel-139106-causal-range-cpu-20261024
jobs:
  offline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch original 13.9.104 decision engine as golden master
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 0ab0a3fb5f48645be8c474088353981eebcf4b4a
          git show 0ab0a3fb5f48645be8c474088353981eebcf4b4a:sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs > sentinel-trading-lab/agent/src/core/now-opportunity-engine.baseline.mjs
          git show 0ab0a3fb5f48645be8c474088353981eebcf4b4a:sentinel-trading-lab/agent/src/core/expiry-trend-adjudicator.mjs > sentinel-trading-lab/agent/src/core/expiry-trend-adjudicator.baseline.mjs
      - name: Syntax check candidate
        run: |
          node --check sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs
          node --check sentinel-trading-lab/agent/src/core/expiry-trend-adjudicator.mjs
      - name: CPU equivalence and real replay comparison
        run: |
          node --test tests/sentinel-139106-causal-cpu-equivalence.test.mjs
      - name: Six-expiry trend-review and legacy regression
        run: |
          node --test tests/sentinel-13931-historical-structure.test.mjs tests/sentinel-oneway-pivot-guard-20261023.test.mjs tests/sentinel-shared-pivot-guard-20261022.test.mjs tests/sentinel-13992-all-expiry-trend-reversal.test.mjs
      - name: Guard broker executor, martingale, UI, risk, database and API
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 0ab0a3fb5f48645be8c474088353981eebcf4b4a HEAD |
            grep -E '^sentinel-trading-lab/(agent/|src/app/api/|src/components/)' |
            grep -v -e '^sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs$' -e '^sentinel-trading-lab/agent/src/core/expiry-trend-adjudicator.mjs$' > /tmp/unexpected || true
          if test -s /tmp/unexpected; then cat /tmp/unexpected; exit 1; fi
          echo 'Only causal range CPU and strict rejection-vs-expiry correction changed.'
