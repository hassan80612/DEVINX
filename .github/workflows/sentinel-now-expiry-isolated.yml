name: Sentinel NOW isolated validation
on:
  push:
    branches:
      - feature/sentinel-now-expiry-one-shot-20261015
permissions:
  contents: read
jobs:
  now-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Inspect module syntax
        run: |
          node --check sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs
          node --check sentinel-trading-lab/agent/src/core/runtime.mjs
          node --check sentinel-trading-lab/agent/worker/local-playwright-driver.mjs
          node --check sentinel-trading-lab/agent/worker/live-bridge.mjs
      - name: Present-entry and existing continuous regressions
        run: |
          node --test tests/sentinel-now-expiry-one-shot.test.mjs \
            tests/sentinel-1395-quote-race-latency.test.mjs \
            tests/sentinel-1380-replan-without-fake-waits.test.mjs \
            tests/sentinel-1394-exclusive-deadline.test.mjs \
            tests/sentinel-1383-signal-latency.test.mjs
      - name: Existing signed PC-to-phone protocol compatibility
        run: |
          node --test tests/sentinel-67315-mobile-integrity.test.mjs \
            tests/sentinel-mobile-wire-auth.test.mjs \
            tests/sentinel-67314-mobile-render.test.mjs \
            tests/sentinel-pc-mobile-signed-clock-6724.test.mjs
      - name: Verify card TypeScript
        working-directory: sentinel-trading-lab
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
