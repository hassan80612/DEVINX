name: Sentinel 13.9.62 immediate broker handoff after last martingale - candidate
on:
  push:
    branches: [fix/sentinel-13962-immediate-signal-handoff-20261020]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'tests/sentinel-13962-*'
      - 'tests/sentinel-13961-*'
      - 'tests/sentinel-13957-click-latency-and-broker-cache.test.mjs'
      - '.github/workflows/sentinel-13962-handoff-regression.yml'
permissions:
  contents: read
concurrency:
  group: sentinel-13962-candidate
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Broker races, four-level recovery, strategy switch and unchanged expiry safety
        run: |
          set -euo pipefail
          find sentinel-trading-lab/agent -name '*.mjs' -type f -print0 | xargs -0 -n1 node --check
          node --test tests/sentinel-13962-handoff-recovery.test.mjs tests/sentinel-13961-nine-click-window.test.mjs tests/sentinel-13960-own-sequence-and-strategy-switch.test.mjs tests/sentinel-13959-decision-integrity-risk.test.mjs tests/sentinel-13958-slow-broker-continuity.test.mjs tests/sentinel-13957-click-latency-and-broker-cache.test.mjs tests/sentinel-13957-stage5-level-priority-and-martingale3.test.mjs tests/sentinel-13956-stage4-independent-outcomes.test.mjs tests/sentinel-13955-session-and-calculation.test.mjs tests/sentinel-13954-bounded-settlement-recovery.test.mjs tests/sentinel-13953-safe-restart.test.mjs tests/sentinel-13953-broker-ack-timeout.test.mjs tests/sentinel-13952-continuous-bot.test.mjs tests/sentinel-13951-click-martingale.test.mjs
      - name: Install web build dependencies
        run: npm install --prefix sentinel-trading-lab --no-audit --no-fund --package-lock=false
      - name: Next.js prebuild and TypeScript full check
        run: |
          npm run prebuild --prefix sentinel-trading-lab
          cd sentinel-trading-lab && npx tsc --noEmit
