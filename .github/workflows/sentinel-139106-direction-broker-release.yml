name: Sentinel 13.9.106 direction and broker performance - NO PRODUCTION
on:
  push:
    branches:
      - release/sentinel-139106-direction-broker-20261024
permissions:
  contents: read
concurrency:
  group: sentinel-139106-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Fetch exact 13.9.104 reference implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 0ab0a3fb5f48645be8c474088353981eebcf4b4a
          git show 0ab0a3fb5f48645be8c474088353981eebcf4b4a:sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs > sentinel-trading-lab/agent/src/core/now-opportunity-engine.baseline.mjs
      - name: Syntax check entire Agent
        run: find sentinel-trading-lab/agent -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Prove CPU optimization changes no base model decision and test broker DOM maintenance
        run: node --test tests/sentinel-139106-causal-cpu-equivalence.test.mjs tests/sentinel-139106-broker-cadence.test.mjs
      - name: Test time-matched rejection review, reversal preservation, native expiry, latency, stops
        run: |
          node --test --test-concurrency=1 tests/sentinel-13992-all-expiry-trend-reversal.test.mjs \
            tests/sentinel-13931-historical-structure.test.mjs \
            tests/sentinel-oneway-pivot-guard-20261023.test.mjs \
            tests/sentinel-shared-pivot-guard-20261022.test.mjs \
            tests/sentinel-13989-expiry-probability-broker-latency.test.mjs \
            tests/sentinel-13983-surgical-balance-expiry-stopwin-horizon.test.mjs \
            tests/sentinel-13965-overlay-throttle.test.mjs \
            tests/sentinel-trade-audit-20261024.test.mjs
      - name: Check release identity and original Windows expiry behavior
        run: node --test tests/sentinel-13996-verified-wall-exhaustion.test.mjs tests/sentinel-13999-native-expiry-keeper.test.mjs tests/sentinel-139100-broker-history-recovery.test.mjs
      - name: Verify no broker clicks, martingale, stop or database changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 0ab0a3fb5f48645be8c474088353981eebcf4b4a HEAD |
            grep -E '(^supabase/|^sentinel-trading-lab/(db|migrations|agent/src/core/|agent/worker/|src/app/api/|src/components/))' |
            grep -v -e '^sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs$' \
                    -e '^sentinel-trading-lab/agent/src/core/expiry-trend-adjudicator.mjs$' \
                    -e '^sentinel-trading-lab/agent/worker/broker-maintenance-cadence.mjs$' \
                    -e '^sentinel-trading-lab/agent/worker/index.mjs$' > /tmp/unsafe.txt || true
          if test -s /tmp/unsafe.txt; then cat /tmp/unsafe.txt; exit 1; fi
          echo 'Only range-model CPU, expiry rejection review and broker maintenance pacing changed.'
      - name: Install dependencies offline from deployment
        run: npm install --prefix sentinel-trading-lab --no-audit --no-fund --package-lock=false
      - name: Build full site and Windows Agent without publishing
        run: npm run build --prefix sentinel-trading-lab
      - name: Verify update and Windows installer payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          root=Path('sentinel-trading-lab')
          agent=root/'agent'
          downloads=root/'public/downloads'
          release=json.loads((agent/'release.json').read_text())
          manifest=json.loads((downloads/'agent-update.json').read_text())
          assert release['version']=='13.9.106'
          assert release['build']=='13.9.106-market-rejection-broker-smooth'
          assert manifest['format']=='sentinel-agent-update-v1'
          assert manifest['version']==release['version'] and manifest['build']==release['build']
          payload=(downloads/'agent_payload_v88.zip').read_bytes()
          assert manifest['zipSha256']==hashlib.sha256(payload).hexdigest()
          exe=downloads/'Sentinel-Agent-13.9.106.exe'
          content=exe.read_bytes()
          assert content[:2]==b'MZ' and len(content)>1_000_000
          assert payload in content
          assert (downloads/'Sentinel-Agent-Windows.exe').read_bytes()==content
          with zipfile.ZipFile(downloads/'agent_payload_v88.zip') as z:
            assert z.testzip() is None
            assert json.loads(z.read('release.json'))==release
            for name in z.namelist():
              if name.endswith('/'):continue
              assert z.read(name)==(agent/name).read_bytes(),name
          print('CANDIDATE VERIFIED',release['version'],len(content),
                hashlib.sha256(content).hexdigest(),len(payload))
          PY
