name: Laser Agent Check

on:
  push:
    branches:
      - main
    paths:
      - 'laser-agent/**'
      - '.github/workflows/laser-agent-check.yml'
  pull_request:
    paths:
      - 'laser-agent/**'
      - '.github/workflows/laser-agent-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-agent:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\laser-agent\DevinXLaserAgent.csproj

      - name: Build
        run: dotnet build .\laser-agent\DevinXLaserAgent.csproj -c Release --no-restore

      - name: Pairing endpoint rejects unsigned payload
        shell: pwsh
        run: |
          $url = 'https://jubiwhtnhxluetzkzomm.supabase.co/functions/v1/laser-agent-pairing-offer'
          $status = curl.exe -sS -o pairing-negative.json -w "%{http_code}" -X POST $url -H "Content-Type: application/json" --data "{}"
          if ($status -ne '400') {
            Write-Host "Unexpected HTTP status: $status"
            Get-Content pairing-negative.json
            exit 1
          }
          $body = Get-Content pairing-negative.json -Raw
          if ($body -notmatch 'protocol_version') {
            Write-Host "Endpoint did not reject the unsigned payload for the expected reason."
            Write-Host $body
            exit 1
          }

      - name: Heartbeat endpoint rejects unsigned payload
        shell: pwsh
        run: |
          $url = 'https://jubiwhtnhxluetzkzomm.supabase.co/functions/v1/laser-agent-heartbeat'
          $status = curl.exe -sS -o heartbeat-negative.json -w "%{http_code}" -X POST $url -H "Content-Type: application/json" --data "{}"
          if ($status -ne '400') {
            Write-Host "Unexpected HTTP status: $status"
            Get-Content heartbeat-negative.json
            exit 1
          }
          $body = Get-Content heartbeat-negative.json -Raw
          if ($body -notmatch 'protocol_version') {
            Write-Host "Heartbeat endpoint did not reject the unsigned payload for the expected reason."
            Write-Host $body
            exit 1
          }

      - name: Publish permanent Agent
        run: dotnet publish .\laser-agent\DevinXLaserAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\laser-agent\publish-agent

      - name: Publish mentor-only executable
        run: dotnet publish .\laser-agent\DevinXLaserAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DefineConstants=DEVINX_MENTOR_ONLY -o .\laser-agent\publish-mentor

      - name: Prepare direct Windows executables
        shell: pwsh
        run: |
          Copy-Item .\laser-agent\publish-agent\DevinXLaserAgent.exe .\laser-agent\DevinX-Laser-Agent-1.1.0.exe -Force
          Copy-Item .\laser-agent\publish-mentor\DevinXLaserAgent.exe .\laser-agent\DevinX-Mentoria-1.1.0.exe -Force
          $agentHash = (Get-FileHash .\laser-agent\DevinX-Laser-Agent-1.1.0.exe -Algorithm SHA256).Hash
          $mentorHash = (Get-FileHash .\laser-agent\DevinX-Mentoria-1.1.0.exe -Algorithm SHA256).Hash
          if ($agentHash -eq $mentorHash) {
            Write-Host "Permanent Agent and Mentoria must be different binaries."
            exit 1
          }

      - name: Upload direct executables
        uses: actions/upload-artifact@v4
        with:
          name: DevinX-Laser-direct-exe
          path: |
            .\laser-agent\DevinX-Laser-Agent-1.1.0.exe
            .\laser-agent\DevinX-Mentoria-1.1.0.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable Agent download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'laser-agent-v1.1.0'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Stable releases are immutable; skipping upload."
            exit 0
          }
          gh release create $tag --title 'DevinX Laser Agent 1.1.0' --notes 'Executáveis diretos do DevinX Laser Control para Windows 10/11 x64. Sem ZIP e sem CMD.'
          gh release upload $tag .\laser-agent\DevinX-Laser-Agent-1.1.0.exe .\laser-agent\DevinX-Mentoria-1.1.0.exe
