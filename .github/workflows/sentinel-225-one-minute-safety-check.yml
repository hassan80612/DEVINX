name: Sentinel 225 one-minute reversal safety checks
# Only independently verified old-level microturns may pass the H207 1m veto.
on:
  push:
    branches: 
      - fix/sentinel-221-github-direct-no-vercel-hop-20261102
    paths:
      - .github/workflows/sentinel-225-one-minute-safety-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site test dependencies
        working-directory: sentinel-trading-lab
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check 1m H207 exception and unchanged continuation protections
        run: |
          set -euo pipefail
          node --test tests/sentinel-225-one-minute-reversal-h207.test.mjs tests/sentinel-220-h207-unified-admission.test.mjs tests/sentinel-222-30s-parity-pre-entry.test.mjs tests/sentinel-222-last-mile-evidence.test.mjs tests/sentinel-201-closed-price-admission.test.mjs tests/sentinel-199-expiry-last-choice.test.mjs tests/sentinel-221-expiry-native-durable.test.mjs
      - name: Run full historical prebuild safety regression
        working-directory: sentinel-trading-lab
        run: npm run prebuild
      - name: Verify TypeScript and JSX
        working-directory: sentinel-trading-lab
        run: npx tsc --noEmit --pretty false
