name: Sentinel Windows Smoke V11

on:
  push:
    branches: [main, sentinel-clean-rebuild]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/agent-launcher.go'
      - 'sentinel-trading-lab/public/downloads/install-agent-v88.ps1'
      - '.github/workflows/sentinel-windows-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    env:
      SENTINEL_SUPABASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Validate Agent source
        shell: powershell
        run: |
          Get-ChildItem 'sentinel-trading-lab/agent' -Recurse -Filter '*.mjs' | ForEach-Object {
            & node --check $_.FullName
            if($LASTEXITCODE -ne 0){throw "Syntax failed: $($_.FullName)"}
          }

      - name: Clean architecture invariants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=@'
          import {readFile} from 'node:fs/promises';
          import {LocalPlaywrightDriver} from './sentinel-trading-lab/agent/worker/local-playwright-driver.mjs';

          const d=new LocalPlaywrightDriver({dataDir:'sentinel-trading-lab/agent/worker/data/smoke-v11'});
          const st=d.state('iq_option');
          st.uiSymbol='USD/CAD OTC';st.symbol='USD/CAD OTC';st.activeId=2112;
          st.activeMap.set('USDCADOTC',2112);st.activeMap.set('USDHKDOTC',1382);
          st.assets.add('USD/CAD OTC');st.assets.add('USD/HKD OTC');
          st.candles=[{from:1,to:2,open:1,high:1,low:1,close:1}];st.quote=1;st.quoteHistory=[{ts:Date.now(),price:1}];

          d.applyActiveSelection('iq_option',{symbol:'USD/HKD OTC',source:'click'});
          if(st.symbol!=='USD/HKD OTC'||st.uiSymbol!=='USD/HKD OTC'||Number(st.activeId)!==1382||st.candles.length!==0||st.quoteHistory.length!==0)throw new Error('asset_switch_not_atomic');

          st.candleSize=60;
          d.ingest('iq_option',JSON.stringify({name:'sendMessage',msg:{name:'binary-options.open-option',body:{active_id:9999,duration:120,size:120}}}),'page-out');
          if(Number(st.activeId)!==1382||Number(st.candleSize)!==60)throw new Error('order_retargeted_market');

          st.activeId=null;st.activeMap.delete('USDHKDOTC');
          d.ingest('iq_option',JSON.stringify({name:'sendMessage',msg:{name:'get-candles',body:{active_id:1382,size:60}}}),'page-out');
          if(Number(st.activeId)!==1382||Number(st.activeMap.get('USDHKDOTC'))!==1382)throw new Error('market_request_did_not_bind_selected_asset');

          st.candles=[];
          d.ingest('iq_option',JSON.stringify({name:'candle-generated',msg:{active_id:9999,size:60,from:100,to:160,open:7,high:8,low:6,close:7.5}}),'page-in');
          if(st.candles.length!==0)throw new Error('cross_asset_candle_leak');
          d.ingest('iq_option',JSON.stringify({name:'candle-generated',msg:{active_id:1382,size:60,from:100,to:160,open:7,high:8,low:6,close:7.5}}),'page-in');
          if(st.candles.length!==1||Number(st.quote)!==7.5)throw new Error('selected_asset_candle_missing');

          const worker=await readFile('./sentinel-trading-lab/agent/worker/index.mjs','utf8');
          const watchdog=await readFile('./sentinel-trading-lab/agent/worker/watchdog.ps1','utf8');
          const broker=await readFile('./sentinel-trading-lab/agent/worker/adapters/browser-broker.mjs','utf8');
          const driver=await readFile('./sentinel-trading-lab/agent/worker/local-playwright-driver.mjs','utf8');

          for(const forbidden of ['readRecoveryPromise','lastReadRecoveryAt'])if(worker.includes(forbidden))throw new Error('legacy_recovery_present:'+forbidden);
          if(worker.includes("for(const adapter of Object.values(brokers))if(adapter.connected)await adapter.disconnect()"))throw new Error('access_check_closes_broker');
          if(/Stop-Process/i.test(watchdog)||/remote-info/i.test(watchdog))throw new Error('watchdog_is_aggressive');
          if(!broker.includes('preserveBrowser:true')||!driver.includes('preservedBrowser:true'))throw new Error('browser_not_preserved');
          const ascii=driver.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
          for(const required of ['VIRADA / REVERS','PRONTIDAO DE ENTRADA','CENARIO POR PRAZO','DATA-SENTINEL-ACTION="REFRESH"'])if(!ascii.includes(required))throw new Error('ui_missing:'+required);
          if(!worker.includes("Bot iniciado · sincronizando leitura"))throw new Error('start_still_depends_on_feed');
          console.log('V11 CLEAN ARCHITECTURE: PASS');
          '@
          Set-Content -Path 'sentinel-v11-smoke.mjs' -Value $script -Encoding UTF8
          node 'sentinel-v11-smoke.mjs'

      - name: Build and install final EXE
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'sentinel-trading-lab/public/downloads' | Out-Null
          Compress-Archive -Path 'sentinel-trading-lab/agent/*' -DestinationPath 'sentinel-trading-lab/public/downloads/agent_payload_v88.zip' -Force
          go build -trimpath -ldflags="-s -w -buildid=" -o 'sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe' 'sentinel-trading-lab/agent-launcher.go'
          if($LASTEXITCODE -ne 0){throw 'EXE build failed'}
          $env:SENTINEL_INSTALL_TEST='1'
          $env:SENTINEL_SUPABASE_URL='http://127.0.0.1:9'
          & 'sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe'
          if($LASTEXITCODE -ne 0){throw "Installer failed: $LASTEXITCODE"}
          $ok=$false
          for($i=0;$i -lt 120;$i++){
            try{
              $h=Invoke-RestMethod 'http://127.0.0.1:8788/health' -TimeoutSec 1
              if($h.ok -and $h.workerHealthy -and $h.version -eq '11.0.0'){$ok=$true;break}
            }catch{}
            Start-Sleep -Milliseconds 500
          }
          if(-not $ok){throw 'V11 Agent/Worker unhealthy after install'}
          Write-Host 'V11 FINAL EXE + WORKER: PASS'

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          try{Invoke-RestMethod 'http://127.0.0.1:8788/exit' -Method Post -TimeoutSec 2|Out-Null}catch{}
          Start-Sleep -Milliseconds 500
