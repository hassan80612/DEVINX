name: Sentinel Windows Smoke

on:
  push:
    branches: [main]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/agent-launcher.go'
      - 'sentinel-trading-lab/public/downloads/install-agent-v88.ps1'
      - '.github/workflows/sentinel-windows-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    env:
      SENTINEL_SUPABASE_URL: http://127.0.0.1:9
    defaults:
      run:
        working-directory: sentinel-trading-lab/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build and execute the final single EXE installer
        shell: powershell
        working-directory: sentinel-trading-lab
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'public/downloads' | Out-Null
          if(Test-Path 'public/downloads/agent_payload_v88.zip'){Remove-Item 'public/downloads/agent_payload_v88.zip' -Force}
          Compress-Archive -Path 'agent/*' -DestinationPath 'public/downloads/agent_payload_v88.zip' -Force
          & go build -trimpath -ldflags="-s -w -buildid=" -o 'public/downloads/Sentinel-Agent-Windows.exe' 'agent-launcher.go'
          if($LASTEXITCODE -ne 0){throw 'Final EXE build failed'}
          if(-not (Test-Path 'public/downloads/Sentinel-Agent-Windows.exe')){throw 'Final EXE missing'}

          $env:SENTINEL_INSTALL_TEST='1'
          $env:SENTINEL_SUPABASE_URL='http://127.0.0.1:9'
          & 'public/downloads/Sentinel-Agent-Windows.exe'
          if($LASTEXITCODE -ne 0){throw "Final EXE installer failed with code $LASTEXITCODE"}

          $ok=$false
          for($i=0;$i -lt 60;$i++){
            Start-Sleep -Milliseconds 300
            try{
              $h=Invoke-RestMethod 'http://127.0.0.1:8788/health' -TimeoutSec 1
              if($h.ok -and $h.workerHealthy -and $h.version -eq '10.12.0'){$ok=$true;break}
            }catch{}
          }
          if(-not $ok){throw 'Installed EXE did not produce a healthy Agent 10.12 + Worker'}

          Write-Host 'FINAL EXE INSTALLER: PASS'
          try{
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              $_.CommandLine -and $_.CommandLine -like '*SentinelTradingLab*' -and $_.Name -eq 'node.exe'
            } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }catch{}
          Remove-Item Env:SENTINEL_INSTALL_TEST -ErrorAction SilentlyContinue

      - name: Install Agent dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run Worker directly and capture startup errors
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:SENTINEL_WORKER_PORT='8787'
          $p=Start-Process -FilePath node -ArgumentList @('worker/index.mjs') -WorkingDirectory $PWD -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\worker-out.log" -RedirectStandardError "$env:RUNNER_TEMP\worker-err.log"
          Start-Sleep -Seconds 4
          $p.Refresh()
          if($p.HasExited){
            Write-Host '=== worker stdout ==='
            if(Test-Path "$env:RUNNER_TEMP\worker-out.log"){Get-Content "$env:RUNNER_TEMP\worker-out.log"}
            Write-Host '=== worker stderr ==='
            if(Test-Path "$env:RUNNER_TEMP\worker-err.log"){Get-Content "$env:RUNNER_TEMP\worker-err.log"}
            throw "Worker exited with code $($p.ExitCode)"
          }
          $w=Invoke-RestMethod 'http://127.0.0.1:8787/health' -TimeoutSec 2
          if(-not $w.ok -or $w.version -ne '10.12.0'){ throw 'Worker health check failed' }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Start Manager and require Worker health
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:SENTINEL_MANAGER_PORT='8788'
          $env:SENTINEL_WORKER_PORT='8787'
          $p=Start-Process -FilePath node -ArgumentList @('worker/agent-manager.mjs') -WorkingDirectory $PWD -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\manager-out.log" -RedirectStandardError "$env:RUNNER_TEMP\manager-err.log"
          try {
            $ok=$false
            for($i=0;$i -lt 60;$i++){
              Start-Sleep -Milliseconds 250
              try {
                $m=Invoke-RestMethod 'http://127.0.0.1:8788/health' -TimeoutSec 1
                if($m.workerHealthy){ $ok=$true; break }
              } catch {}
            }
            if(-not $ok){ throw 'Worker did not become healthy through Manager' }
          } finally {
            try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
          }

      - name: Watchdog recovers dead Manager
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:SENTINEL_WORKER_PORT='8787'
          $env:SENTINEL_MANAGER_PORT='8788'
          $env:SENTINEL_NODE_PATH=(Get-Command node).Source

          $manager=Start-Process -FilePath node -ArgumentList @('worker/agent-manager.mjs') -WorkingDirectory $PWD -PassThru
          $ok=$false
          for($i=0;$i -lt 40;$i++){
            Start-Sleep -Milliseconds 250
            try {
              $h=Invoke-RestMethod 'http://127.0.0.1:8788/health' -TimeoutSec 1
              if($h.ok -and $h.workerHealthy){$ok=$true;break}
            } catch {}
          }
          if(-not $ok){throw 'Manager did not start before watchdog test'}

          Stop-Process -Id $manager.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File worker/watchdog.ps1
          $recovered=$false
          for($i=0;$i -lt 40;$i++){
            Start-Sleep -Milliseconds 250
            try {
              $h=Invoke-RestMethod 'http://127.0.0.1:8788/health' -TimeoutSec 1
              if($h.ok -and $h.workerHealthy){$recovered=$true;break}
            } catch {}
          }
          if(-not $recovered){
            if(Test-Path 'worker/data/watchdog.log'){Get-Content 'worker/data/watchdog.log'}
            throw 'Watchdog failed to recover Manager + Worker'
          }
          Write-Host 'Watchdog recovered Manager + Worker successfully'
          try {
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              $_.Name -eq 'node.exe' -and $_.CommandLine -and $_.CommandLine -like '*agent-manager.mjs*'
            } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          } catch {}

      - name: Persistent watchdog host recovers Manager
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:SENTINEL_WORKER_PORT='8787'
          $env:SENTINEL_MANAGER_PORT='8788'
          $env:SENTINEL_NODE_PATH=(Get-Command node).Source

          $manager=Start-Process -FilePath node -ArgumentList @('worker/agent-manager.mjs') -WorkingDirectory $PWD -PassThru
          $ok=$false
          for($i=0;$i -lt 40;$i++){
            Start-Sleep -Milliseconds 250
            try{
              $h=Invoke-RestMethod 'http://127.0.0.1:8788/health' -TimeoutSec 1
              if($h.ok -and $h.workerHealthy){$ok=$true;break}
            }catch{}
          }
          if(-not $ok){throw 'Manager did not start before persistent watchdog test'}

          $watchdogProc=Start-Process -FilePath powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','worker/watchdog-host.ps1') -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          Stop-Process -Id $manager.Id -Force -ErrorAction SilentlyContinue

          $recovered=$false
          for($i=0;$i -lt 90;$i++){
            Start-Sleep -Milliseconds 350
            try{
              $h=Invoke-RestMethod 'http://127.0.0.1:8788/health' -TimeoutSec 1
              if($h.ok -and $h.workerHealthy){$recovered=$true;break}
            }catch{}
          }
          if(-not $recovered){throw 'Persistent watchdog host failed to recover Manager + Worker'}
          Write-Host 'PERSISTENT WATCHDOG HOST: PASS'

          Stop-Process -Id $watchdogProc.Id -Force -ErrorAction SilentlyContinue
          try{
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
              $_.Name -eq 'node.exe' -and $_.CommandLine -and $_.CommandLine -like '*agent-manager.mjs*'
            } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }catch{}

      - name: Broker visible launch creates Playwright session
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script = @'
          import {LocalPlaywrightDriver} from './worker/local-playwright-driver.mjs';
          import {analyzeMarket} from './src/core/strategy.mjs';
          import {DemoTradingRuntime} from './src/core/runtime.mjs';
          import {readFile} from 'node:fs/promises';
          const workerSource=await readFile('./worker/index.mjs','utf8');
          if(workerSource.includes("if(action==='start'){ensureAccess('/control/start')")||!workerSource.includes('localCockpitLeaseValid')||!workerSource.includes('await ensureLocalCockpitBroker(provider)')||!workerSource.includes('if(!localCockpitLeaseValid())'))throw new Error('local_start_not_fully_independent');
          console.log('LOCAL COCKPIT START/PERSISTENCE: PASS');
          const candles=Array.from({length:80},(_,i)=>{const base=1+i*.001;return{from:1700000000+i*60,to:1700000060+i*60,open:base,high:base+.0008,low:base-.0005,close:base+.0005,volume:100+i}});
          const analysis=analyzeMarket({candles,strategy:'smart_confluence',minConfidence:74,freshnessMs:5000,quoteTs:Date.now(),now:Date.now()});
          if(!analysis.forecast30||analysis.forecast30.horizonSeconds!==30||!Number.isFinite(Number(analysis.forecast30.callStrength))||!Number.isFinite(Number(analysis.forecast30.putStrength)))throw new Error('forecast30_missing');
          console.log('30S PRE-SIGNAL: PASS',JSON.stringify(analysis.forecast30));
          const planner=analysis.entryPlanner?.horizons||{};
          for(const h of ['30','60','120','300','600','900']){const p=planner[h];if(!p||!Number.isFinite(Number(p.callTrigger))||!Number.isFinite(Number(p.putTrigger))||!Number.isFinite(Number(p.callInvalidation))||!Number.isFinite(Number(p.putInvalidation)))throw new Error('entry_planner_missing_'+h)}
          console.log('MULTI-HORIZON ENTRY PLANNER: PASS',Object.keys(planner).join(','));
          const fc=analysis.finalConfluence;
          if(!fc||!['CALL','PUT','AGUARDAR'].includes(String(fc.side))||!Number.isFinite(Number(fc.strength))||!Number.isFinite(Number(fc.callStrength))||!Number.isFinite(Number(fc.putStrength)))throw new Error('final_confluence_missing:'+JSON.stringify(fc));
          console.log('FINAL CONFLUENCE: PASS',JSON.stringify(fc));
          const bearCandles=Array.from({length:100},(_,i)=>{const base=1.20-i*.00045;return{from:1701000000+i*60,to:1701000060+i*60,open:base+.00012,high:base+.00028,low:base-.00028,close:base,volume:100+i}});
          const tNow=Date.now();
          const risingQuotes=Array.from({length:80},(_,i)=>({ts:tNow-(79-i)*1000,price:.945+i*.000025+Math.sin(i*Math.PI*2/18)*.00045+(i>=70?(i-69)*.00022:0)}));
          const fallingQuotes=Array.from({length:80},(_,i)=>({ts:tNow-(79-i)*1000,price:.958-i*.000025+Math.sin(i*Math.PI*2/18)*.00005}));
          const chasingDownQuotes=Array.from({length:80},(_,i)=>({ts:tNow-(79-i)*1000,price:.958-i*.000025+Math.sin(i*Math.PI*2/18)*.00005-(i>=70?(i-69)*.00022:0)}));
          const oppose=analyzeMarket({candles:bearCandles,quoteHistory:risingQuotes,strategy:'smart_confluence',minConfidence:74,durationMs:30000,freshnessMs:5000,quoteTs:tNow,now:tNow});
          const aligned=analyzeMarket({candles:bearCandles,quoteHistory:fallingQuotes,strategy:'smart_confluence',minConfidence:74,durationMs:30000,freshnessMs:5000,quoteTs:tNow,now:tNow});
          const chased=analyzeMarket({candles:bearCandles,quoteHistory:chasingDownQuotes,strategy:'smart_confluence',minConfidence:74,durationMs:30000,freshnessMs:5000,quoteTs:tNow,now:tNow});
          if(!oppose.metrics?.micro?.ready||oppose.metrics.micro.pulse<=0||!aligned.metrics?.micro?.ready||aligned.metrics.micro.pulse>=0)throw new Error('microflow_direction_failed:'+JSON.stringify({oppose:oppose.metrics?.micro,aligned:aligned.metrics?.micro}));
          if(!oppose.metrics?.shortModel?.ready||!aligned.metrics?.shortModel?.ready)throw new Error('five_second_microstructure_not_ready:'+JSON.stringify({oppose:oppose.metrics?.shortModel,aligned:aligned.metrics?.shortModel}));
          if(Number(oppose.metrics.sellEffective)>=Number(aligned.metrics.sellEffective))throw new Error('microstructure_did_not_penalize_late_put:'+JSON.stringify({oppose:oppose.metrics.sellEffective,aligned:aligned.metrics.sellEffective}));
          if(oppose.side==='SELL')throw new Error('late_put_not_blocked:'+JSON.stringify({side:oppose.side,confidence:oppose.confidence,micro:oppose.metrics.micro,short:oppose.metrics.shortModel}));
          if(aligned.side!=='SELL'||Number(aligned.confidence)<74||aligned.metrics?.shortModel?.putOverextended)throw new Error('aligned_put_not_released:'+JSON.stringify({side:aligned.side,confidence:aligned.confidence,short:aligned.metrics.shortModel}));
          if(chased.side==='SELL'||chased.metrics?.shortModel?.putOverextended!==true)throw new Error('extended_put_chasing_not_blocked:'+JSON.stringify({side:chased.side,confidence:chased.confidence,short:chased.metrics?.shortModel,micro:chased.metrics?.micro}));
          console.log('5S ENTRY + ANTI-CHASE ENGINE: PASS',JSON.stringify({opposeSide:oppose.side,alignedSide:aligned.side,chasedSide:chased.side,chasedExtended:chased.metrics.shortModel.putOverextended}));
          const rev=aligned.metrics?.shortModel||{};
          for(const v of [rev.reversalCallScore,rev.reversalPutScore])if(v!=null&&(!Number.isFinite(Number(v))||Number(v)<0||Number(v)>100))throw new Error('reversal_score_out_of_range:'+JSON.stringify(rev));
          console.log('REVERSAL SCORES: PASS',JSON.stringify({call:rev.reversalCallScore,put:rev.reversalPutScore}));
          const rt=new DemoTradingRuntime();
          rt.settings.asset='EUR/USD OTC';rt.settings.strategy='smart_confluence';rt.settings.orderDurationMs=30000;
          const badKey=rt._validationKey('confirmed','EUR/USD OTC',30000,'smart_confluence');
          rt.signalValidation.outcomes=Array.from({length:12},(_,i)=>({key:badKey,won:i<3}));
          const bad=rt._validationStats(badKey);
          if(bad.ready||bad.winRate!==25)throw new Error('bad_signal_validation_not_blocked:'+JSON.stringify(bad));
          const gateNow=Date.now();
          const syntheticSell={side:'SELL',confidence:90,reasons:[],forecast30:{side:'SELL',confidence:90},metrics:{buyScore:18,sellScore:90,shortModel:{ready:true}}};
          const g1=rt._signalValidationGate({analysis:syntheticSell,snap:{price:1.1},settings:rt.settings,now:gateNow});
          const g2=rt._signalValidationGate({analysis:syntheticSell,snap:{price:1.1},settings:rt.settings,now:gateNow+400});
          if(g1.allowed!==false||g1.analysis.side!=='SELL'||g1.analysis.automationBlockReason!=='confirming')throw new Error('short_confirmation_failed:'+JSON.stringify(g1));
          if(g2.allowed!==true||g2.analysis.side!=='SELL'||g2.analysis.quality?.entryReady!==true)throw new Error('technical_entry_not_released:'+JSON.stringify(g2));
          if(g2.analysis.quality?.historicalReady!==false)throw new Error('history_should_remain_informational:'+JSON.stringify(g2.analysis.quality));
          rt.signalValidation.outcomes=Array.from({length:12},(_,i)=>({key:badKey,won:i<8}));
          const good=rt._validationStats(badKey);
          if(!good.ready||good.winRate<60)throw new Error('good_signal_validation_stats_failed:'+JSON.stringify(good));
          console.log('ENTRY READINESS + INFORMATIONAL HISTORY: PASS',JSON.stringify({bad,good,g1:g1.analysis.automationBlockReason,g2:g2.allowed}));
          const d=new LocalPlaywrightDriver({dataDir:'worker/data/smoke-browser'});
          const s=await d.launchNormal('iq_option',{manual:true});
          const info=await d.sessionInfo('iq_option');
          if(!s?.context || !s?.page || !info?.open) throw new Error('broker_visible_launch_failed');
          console.log('BROKER OPEN PASS',JSON.stringify({url:info.url,phase:info.phase,background:info.background||false}));
          const testPage=await s.context.newPage();
          await testPage.setContent('<button id="eurusd">EUR/USD (OTC)</button><button id="eurthb">EUR/THB (OTC)</button>');
          await d.installBridge(testPage,'iq_option');
          await testPage.click('#eurthb');
          const clicked=await testPage.evaluate(()=>window.__sentinelClickedSymbol||'');
          if(clicked!=='EUR/THB OTC')throw new Error('asset_click_tracking_failed:'+clicked);
          console.log('ASSET CLICK TRACKING: PASS',clicked);
          const st=d.state('iq_option');
          st.assets=new Set(['EUR/USD OTC','EUR/THB OTC']);
          st.activeMap=new Map([['EURUSDOTC',1],['EURTHBOTC',2]]);

          await testPage.evaluate(()=>{window.__sentinelClickedSymbol='';window.__sentinelClickedSymbolAt=0});
          await testPage.setContent('<div id="thb" role="tab" aria-selected="false">EUR/THB OTC</div><div id="usd" role="tab" aria-selected="true">EUR/USD OTC</div>');
          s.page=testPage;s.background=false;
          st.uiSymbol='EUR/THB OTC';st.symbol='EUR/THB OTC';st.activeId=2;st.candles=[{from:1,to:2,open:1,high:1,low:1,close:1}];
          await d.domSnapshot('iq_option',{fast:true});
          if(st.uiSymbol!=='EUR/USD OTC'||st.symbol!=='EUR/USD OTC'||Number(st.activeId)!==1||st.candles.length!==0)throw new Error('dom_active_tab_switch_failed:'+JSON.stringify({ui:st.uiSymbol,symbol:st.symbol,id:st.activeId,candles:st.candles.length}));
          console.log('DOM ACTIVE TAB SWITCH: PASS',st.uiSymbol);
          await testPage.evaluate(()=>{document.querySelector('#usd').setAttribute('aria-selected','false');document.querySelector('#thb').setAttribute('aria-selected','true')});
          await d.domSnapshot('iq_option',{fast:true});
          if(st.uiSymbol!=='EUR/THB OTC'||st.symbol!=='EUR/THB OTC'||Number(st.activeId)!==2)throw new Error('dom_second_tab_switch_failed:'+JSON.stringify({ui:st.uiSymbol,symbol:st.symbol,id:st.activeId}));
          console.log('DOM SECOND TAB SWITCH: PASS',st.uiSymbol);

          st.uiSymbol='EUR/USD OTC';st.symbol='EUR/USD OTC';st.activeId=1;st.candles=[{from:1,to:2,open:1,high:1,low:1,close:1}];
          await testPage.evaluate(()=>{document.querySelector('#usd').setAttribute('aria-selected','true');document.querySelector('#thb').setAttribute('aria-selected','false')});
          await new Promise(r=>setTimeout(r,30));
          await testPage.evaluate(()=>{document.querySelector('#usd').setAttribute('aria-selected','false');document.querySelector('#thb').setAttribute('aria-selected','true')});
          await new Promise(r=>setTimeout(r,80));
          if(st.uiSymbol!=='EUR/THB OTC'||st.symbol!=='EUR/THB OTC'||Number(st.activeId)!==2||st.candles.length!==0)throw new Error('instant_asset_bridge_failed:'+JSON.stringify({ui:st.uiSymbol,symbol:st.symbol,id:st.activeId,candles:st.candles.length}));
          console.log('INSTANT ACTIVE-ASSET BRIDGE: PASS',st.uiSymbol);

          st.uiSymbol='EUR/THB OTC';st.symbol='EUR/THB OTC';st.activeId=2;st.candles=[{from:1,to:2,open:2,high:2.1,low:1.9,close:2}];
          d.ingest('iq_option',JSON.stringify({name:'sendMessage',msg:{name:'binary-options.open-option',body:{active_id:1,size:60}}}),'page-out');
          if(st.uiSymbol!=='EUR/THB OTC'||st.symbol!=='EUR/THB OTC'||Number(st.activeId)!==2||st.candles.length!==1)throw new Error('outbound_order_retargeted_asset:'+JSON.stringify({ui:st.uiSymbol,symbol:st.symbol,id:st.activeId,candles:st.candles.length}));
          console.log('OUTBOUND ORDER DOES NOT RETARGET MARKET: PASS',st.uiSymbol);

          st.candles=[];st.activeId=2;
          let realtimeEvents=0;d.setMarketUpdateHandler(()=>{realtimeEvents++});
          d.ingest('iq_option',JSON.stringify({name:'candle-generated',msg:{active_id:1,size:60,from:100,to:160,open:1,close:1.1,high:1.2,low:.9}}),'page-in');
          if(st.candles.length!==0)throw new Error('cross_asset_candle_leak');
          d.ingest('iq_option',JSON.stringify({name:'candle-generated',msg:{active_id:2,size:60,from:100,to:160,open:1,close:1.1,high:1.2,low:.9}}),'page-in');
          await new Promise(r=>setTimeout(r,20));
          if(st.candles.length!==1||Number(st.candles[0].close)!==1.1)throw new Error('selected_asset_candle_missing');
          if(realtimeEvents<1)throw new Error('realtime_market_event_missing');
          console.log('ASSET ANALYSIS ISOLATION: PASS');
          console.log('REALTIME MARKET EVENT: PASS',realtimeEvents);
          st.quoteHistory=[];
          d.ingest('iq_option',JSON.stringify({name:'instrument-quotes-generated',msg:{active_id:2,price:1.101}}),'page-in');
          await new Promise(r=>setTimeout(r,5));
          d.ingest('iq_option',JSON.stringify({name:'instrument-quotes-generated',msg:{active_id:2,price:1.102}}),'page-in');
          if((st.quoteHistory||[]).length<2||Number(st.quoteHistory.at(-1)?.price)!==1.102)throw new Error('live_quote_history_missing:'+JSON.stringify(st.quoteHistory));
          console.log('LIVE QUOTE HISTORY: PASS',st.quoteHistory.length);
          const freshCandleAt=Date.now(),oldQuoteAt=freshCandleAt-12000;
          st.lastQuoteAt=oldQuoteAt;st.lastCandleAt=freshCandleAt;
          const freshnessStatus=d.liveStatus('iq_option');
          if(Number(freshnessStatus.quoteTs)!==freshCandleAt)throw new Error('freshest_market_timestamp_failed:'+JSON.stringify({quoteTs:freshnessStatus.quoteTs,oldQuoteAt,freshCandleAt}));
          console.log('FRESHEST QUOTE/CANDLE CLOCK: PASS',freshnessStatus.quoteTs);

          s.page=testPage;s.background=false;
          await d.updateOverlay('iq_option',{asset:'EUR/USD OTC',agentVersion:'10.12.0',strategy:'smart_confluence',side:'WAIT',confidence:36,reasons:['teste de estrutura'],metrics:{buyScore:51,sellScore:44,fast:1.1,slow:1.2,rsi:48,macd:{histogram:.01},stoch:52,atr:.003},finalConfluence:analysis.finalConfluence,entryPlanner:analysis.entryPlanner,forecast30:{side:'WAIT',biasSide:'SELL',confidence:66,horizonSeconds:30,callStrength:32,putStrength:66,trigger:74,callGap:42,putGap:8,validation:{ready:false,samples:3,minSamples:12,winRate:33.3,minWinRate:60}},quality:{status:'COLETANDO',rawSide:'SELL',confirmed:{ready:false,samples:3,minSamples:12,winRate:33.3,minWinRate:60},forecast:{ready:false,samples:3,minSamples:12,winRate:33.3,minWinRate:60}},minConfidence:74,plan:{entry:'Aguardar',exit:'Sem entrada'},nextEval:'—',realtime:true,liveAgeMs:90,durationMs:30000,mode:'demo',brokerMode:'demo',state:'stopped'});
          const overlayText=await testPage.locator('#sentinel-trading-overlay').innerText();
          const overlayAscii=overlayText.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
          if(!overlayAscii.includes('SENTINEL V10.12.0')||!overlayAscii.includes('CENARIO POR PRAZO')||!overlayAscii.includes('PRONTIDAO DE ENTRADA')||!overlayAscii.includes('CONFLUENCIA TECNICA')||!overlayAscii.includes('DIRECAO / CONTEXTO')||!overlayAscii.includes('VIRADA / REVERSAO')||!overlayAscii.includes('ESTIMATIVA TECNICA')||!overlayAscii.includes('FILTRO')||!overlayAscii.includes('CONTROLE DO BOT')||!overlayAscii.includes('INICIAR')||!overlayAscii.includes('PAUSAR')||!overlayAscii.includes('PARAR'))throw new Error('overlay_outlook_required_content_missing:'+overlayAscii);
