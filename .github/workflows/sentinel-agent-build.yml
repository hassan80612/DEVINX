# V11.9.2 validated source build
name: Sentinel Windows Agent V11.9.2

on:
  push:
    branches: [main, sentinel-v119-reliable-panel]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/agent-launcher.go'
      - 'sentinel-trading-lab/public/downloads/install-agent-v88.ps1'
      - 'sentinel-trading-lab/public/downloads/Instalar-Sentinel-8.8.cmd'
      - '.github/workflows/sentinel-agent-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Validate Agent source
        shell: bash
        run: |
          set -euo pipefail
          find sentinel-trading-lab/agent -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --test sentinel-trading-lab/agent/test/signal-contract.test.mjs

      - name: Build Agent V11.9.2 payload
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          mkdir -p public/downloads
          rm -f public/downloads/agent_payload_v88.zip
          python3 - <<'PYZIP'
          from pathlib import Path
          import zipfile
          root=Path('agent')
          with zipfile.ZipFile('public/downloads/agent_payload_v88.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file(): continue
                  name=path.relative_to(root).as_posix()
                  if name.startswith(('node_modules/','worker/data/')) or name.endswith(('.log','.DS_Store')): continue
                  info=zipfile.ZipInfo(name,(2026,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644 << 16
                  archive.writestr(info,path.read_bytes(),compresslevel=9)
          PYZIP
          unzip -l public/downloads/agent_payload_v88.zip | head -80
          test -f agent/worker/sentinel.ico
          cp agent/worker/sentinel.ico public/favicon.ico

      - name: Build single Windows EXE with Sentinel icon
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico agent/worker/sentinel.ico -arch amd64 -o sentinel_icon.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o public/downloads/Sentinel-Agent-Windows.exe agent-launcher.go
          rm -f sentinel_icon.syso
          file public/downloads/Sentinel-Agent-Windows.exe
          sha256sum public/downloads/Sentinel-Agent-Windows.exe
          test "$(stat -c%s public/downloads/Sentinel-Agent-Windows.exe)" -gt "$(stat -c%s public/downloads/agent_payload_v88.zip)"

      - name: Commit generated Agent files
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cp sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe "$tmpdir/"
          cp sentinel-trading-lab/public/downloads/agent_payload_v88.zip "$tmpdir/"
          cp sentinel-trading-lab/public/favicon.ico "$tmpdir/favicon.ico"

          branch="${GITHUB_REF_NAME}"
          git fetch origin "$branch"
          if [ "$(git rev-parse "origin/$branch")" != "$GITHUB_SHA" ]; then
            echo 'Source branch advanced; refusing to publish an older Agent.'
            exit 1
          fi

          cp "$tmpdir/Sentinel-Agent-Windows.exe" sentinel-trading-lab/public/downloads/
          cp "$tmpdir/agent_payload_v88.zip" sentinel-trading-lab/public/downloads/
          cp "$tmpdir/favicon.ico" sentinel-trading-lab/public/favicon.ico

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe sentinel-trading-lab/public/downloads/agent_payload_v88.zip sentinel-trading-lab/public/favicon.ico
          if git diff --cached --quiet; then
            echo 'Agent 11.9 generated files already current.'
            exit 0
          fi
          git commit -m 'build(sentinel): refresh Windows Agent V11.9.2'
          git push origin "HEAD:$branch"

