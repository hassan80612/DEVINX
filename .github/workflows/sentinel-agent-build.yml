# V13.3 validated source build
name: Sentinel Windows Agent V13.3

on:
  push:
    branches: [sentinel-retouch-1334-1007]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/agent-launcher.go'
      - 'sentinel-trading-lab/public/downloads/install-agent-v88.ps1'
      - 'sentinel-trading-lab/public/downloads/Instalar-Sentinel-8.8.cmd'
      - '.github/workflows/sentinel-agent-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-retouch-1334-1007
  cancel-in-progress: true

jobs:
  build-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Validate Agent source
        shell: bash
        run: |
          set -euo pipefail
          find sentinel-trading-lab/agent -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --test tests/sentinel*.test.mjs

      - name: Build Agent V13.3 payload
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          mkdir -p public/downloads
          rm -f public/downloads/agent_payload_v88.zip
          (
            cd agent
            zip -qr ../public/downloads/agent_payload_v88.zip .               -x 'node_modules/*' 'worker/data/*' '*.log' '.DS_Store'
          )
          unzip -l public/downloads/agent_payload_v88.zip | head -80
          test -f agent/worker/sentinel.ico
          cp agent/worker/sentinel.ico public/favicon.ico

      - name: Build single Windows EXE with Sentinel icon
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico agent/worker/sentinel.ico -arch amd64 -o sentinel_icon.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o public/downloads/Sentinel-Agent-Windows.exe agent-launcher.go
          rm -f sentinel_icon.syso
          file public/downloads/Sentinel-Agent-Windows.exe
          sha256sum public/downloads/Sentinel-Agent-Windows.exe
          test "$(stat -c%s public/downloads/Sentinel-Agent-Windows.exe)" -gt "$(stat -c%s public/downloads/agent_payload_v88.zip)"

      - name: Commit generated Agent files
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cp sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe "$tmpdir/"
          cp sentinel-trading-lab/public/downloads/agent_payload_v88.zip "$tmpdir/"
          cp sentinel-trading-lab/public/favicon.ico "$tmpdir/favicon.ico"

          git fetch origin sentinel-retouch-1334-1007
          git reset --hard origin/sentinel-retouch-1334-1007

          cp "$tmpdir/Sentinel-Agent-Windows.exe" sentinel-trading-lab/public/downloads/
          cp "$tmpdir/agent_payload_v88.zip" sentinel-trading-lab/public/downloads/
          cp "$tmpdir/favicon.ico" sentinel-trading-lab/public/favicon.ico
          cp "$tmpdir/Sentinel-Agent-Windows.exe" sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe
          sed -i 's/v=13\.3\.0-r4&release=sentinel-v13-3-market-window/v=13.3.0-r5\&release=sentinel-v13-3-pilot-failover/g' sentinel-trading-lab/src/app/page.tsx

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe sentinel-trading-lab/public/downloads/agent_payload_v88.zip sentinel-trading-lab/public/favicon.ico sentinel-trading-lab/src/app/page.tsx
          if git diff --cached --quiet; then
            echo 'Agent 13.3 generated files already current.'
            exit 0
          fi
          git commit -m 'build(sentinel): refresh Windows Agent V13.3'
          git push origin HEAD:sentinel-retouch-1334-1007
