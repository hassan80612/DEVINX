name: Sentinel Windows Agent

on:
  push:
    branches: [main]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/agent-launcher.go'
      - 'sentinel-trading-lab/public/downloads/install-agent-v88.ps1'
      - 'sentinel-trading-lab/public/downloads/Instalar-Sentinel-8.8.cmd'
      - '.github/workflows/sentinel-agent-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Validate Agent source
        shell: bash
        run: |
          set -euo pipefail
          find sentinel-trading-lab/agent -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Build Agent V8.8 payload
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          mkdir -p public/downloads
          rm -f public/downloads/agent_payload_v88.zip
          (
            cd agent
            zip -qr ../public/downloads/agent_payload_v88.zip .               -x 'node_modules/*' 'worker/data/*' '*.log' '.DS_Store'
          )
          unzip -l public/downloads/agent_payload_v88.zip | head -80
          test -f agent/worker/sentinel.ico
          cp agent/worker/sentinel.ico public/favicon.ico

      - name: Build Windows launcher
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build             -trimpath -ldflags='-s -w -buildid='             -o public/downloads/Sentinel-Agent-Windows.exe agent-launcher.go
          file public/downloads/Sentinel-Agent-Windows.exe
          sha256sum public/downloads/Sentinel-Agent-Windows.exe

      - name: Build portable V8.8 package
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab/public/downloads
          rm -f Sentinel-Agent-8.8-Pacote.zip
          zip -j Sentinel-Agent-8.8-Pacote.zip             install-agent-v88.ps1             agent_payload_v88.zip             Instalar-Sentinel-8.8.cmd
          unzip -l Sentinel-Agent-8.8-Pacote.zip

      - name: Commit generated Agent files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe             sentinel-trading-lab/public/downloads/agent_payload_v88.zip             sentinel-trading-lab/public/downloads/Sentinel-Agent-8.8-Pacote.zip             sentinel-trading-lab/public/favicon.ico
          if git diff --cached --quiet; then
            echo 'Agent 8.8 generated files already current.'
            exit 0
          fi
          git commit -m 'build(sentinel): refresh Windows Agent V8.8'
          git pull --rebase origin main
          git push
