name: Sentinel 67 Real 1s Market Holdout — Offline Only
on:
  push:
    branches: [sentinel-67-branching-path-offline-20261011]
    paths:
      - 'tests/sentinel-67-real-1s-market.test.mjs'
      - '.github/workflows/sentinel-67-market-holdout.yml'
permissions:
  contents: read
jobs:
  archived-market:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Protect exact original 13.4.67 website and forecast code
        run: |
          set -euo pipefail
          git diff --exit-code 5c20afbef3060d00a5caa52cf0498aebff6b20c9 HEAD -- sentinel-trading-lab/src sentinel-trading-lab/agent/worker sentinel-trading-lab/agent/release.json sentinel-trading-lab/agent/package.json sentinel-trading-lab/public sentinel-trading-lab/agent/src/core/vnext-single-engine.mjs sentinel-trading-lab/agent/src/core/automatic-forward-model.mjs sentinel-trading-lab/agent/src/core/historical-forward-analogs.mjs sentinel-trading-lab/agent/src/core/specialist-forward-models.mjs
      - name: Fetch four independent official archived market streams (1s close, not OTC)
        run: |
          set -euo pipefail
          mkdir -p tmp/sentinel-market-1s
          for symbol in BTCUSDT ETHUSDT; do
            for date in 2026-10-08 2026-10-09; do
              filename="$symbol-1s-$date"
              url="https://data.binance.vision/data/spot/daily/klines/$symbol/1s/$filename.zip"
              curl -fLsS --retry 3 --connect-timeout 15 --max-time 95 "$url" -o "tmp/$filename.zip"
              unzip -p "tmp/$filename.zip" "$filename.csv" > "tmp/sentinel-market-1s/$filename.csv"
              test "$(wc -l < "tmp/sentinel-market-1s/$filename.csv")" -gt 80000
              echo "ARCHIVE_OK $filename $(wc -l < "tmp/sentinel-market-1s/$filename.csv")"
            done
          done
      - name: Out-of-sample 30s, 60s and 180s price-direction comparison
        run: node --test tests/sentinel-67-real-1s-market.test.mjs
