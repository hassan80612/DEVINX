name: Sentinel VNext single-engine contract
on:
  push:
    branches: [sentinel-engine-independence-1359-20261010]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-engine-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Independent engine catalog and compatibility contract
        run: |
          node --check sentinel-trading-lab/agent/src/core/scenario-engine-catalog.mjs
          node --check sentinel-trading-lab/agent/src/core/expiry-driven-forecast.mjs
          node --check sentinel-trading-lab/agent/src/core/forward-forecast-receipt.mjs
          node --check sentinel-trading-lab/agent/src/core/automatic-forward-model.mjs
          node --test tests/sentinel-single-engine-contract-1359.test.mjs tests/sentinel-expiry-driven-1359.test.mjs tests/sentinel-forward-forecast-proof-1359.test.mjs tests/sentinel-automatic-forward-model-1359.test.mjs
