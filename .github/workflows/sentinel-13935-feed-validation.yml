name: Sentinel 13.9.35 isolated feed validation
on:
  push:
    branches:
      - fix/sentinel-13935-bounded-feed-20261017
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'tests/sentinel-13935-feed-bound.test.mjs'
      - '.github/workflows/sentinel-13935-feed-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate agent module syntax
        shell: bash
        run: find sentinel-trading-lab/agent -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Verify bounded memory, existing quote freshness and decision consistency
        run: |
          node --test \
            tests/sentinel-13935-feed-bound.test.mjs \
            tests/sentinel-fast-feed-history.test.mjs \
            tests/sentinel-1395-quote-race-latency.test.mjs \
            tests/sentinel-1385-asset-history-latency.test.mjs \
            tests/sentinel-13931-historical-structure.test.mjs \
            tests/sentinel-forecast-asset-isolation.test.mjs \
            tests/sentinel-short-expiry-and-broker-performance-13919.test.mjs \
            tests/sentinel-range-oscillation-1393.test.mjs
