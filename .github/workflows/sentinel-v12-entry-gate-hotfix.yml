name: Sentinel V12 entry gate hotfix build
on:
  pull_request:
    branches: [main]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/agent-launcher.go'
      - '.github/workflows/sentinel-v12-entry-gate-hotfix.yml'
permissions:
  contents: write
jobs:
  validate-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-v12-entry-gate-hotfix-20261006
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Validate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem 'sentinel-trading-lab/agent' -Recurse -Filter '*.mjs' | ForEach-Object {
            & node --check $_.FullName
            if($LASTEXITCODE -ne 0){throw "Syntax failed: $($_.FullName)"}
          }
          $runtime=Get-Content 'sentinel-trading-lab/agent/src/core/runtime.mjs' -Raw
          if($runtime -notmatch "plan\.directionReady===true"){throw 'strict directionReady entry gate missing'}
          Write-Host 'V12 ENTRY GATE: PASS'
      - name: Build artifacts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path 'sentinel-trading-lab/agent/*' -DestinationPath 'sentinel-trading-lab/public/downloads/agent_payload_v88.zip' -Force
          go build -trimpath -ldflags="-s -w -buildid=" -o 'sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe' 'sentinel-trading-lab/agent-launcher.go'
          if($LASTEXITCODE -ne 0){throw 'EXE build failed'}
          Write-Host 'V12 ENTRY GATE BUILD: PASS'
      - name: Commit artifacts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sentinel-trading-lab/public/downloads/agent_payload_v88.zip sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){Write-Host 'Artifacts unchanged'; exit 0}
          git commit -m "build(sentinel): rebuild V12 with strict entry gate"
          git pull --rebase origin sentinel-v12-entry-gate-hotfix-20261006
          git push origin HEAD:sentinel-v12-entry-gate-hotfix-20261006
