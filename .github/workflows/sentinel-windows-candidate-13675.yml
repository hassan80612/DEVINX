# VNext release: regenerate embedded agent and checksum from the exact source commit.
# Rebuild verified final Agent with the stable-clock regression fixed.
name: Sentinel Windows 13.4.67.5 Selected Strategy Strengths

on:
  push:
    branches: [sentinel-selected-strengths-675-20261012]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/src/**'
      - 'tests/sentinel-v13464-mobile-feed-continuity.test.mjs'
      - 'tests/sentinel-v13465-rollback.test.mjs'
      - 'tests/sentinel-v13460-cards-outcomes.test.mjs'
      - 'tests/sentinel-v13466-multihorizon-forecasts.test.mjs'
      - 'tests/sentinel-v13467-future-entry.test.mjs'
      - 'tests/sentinel-v134672-adaptive-integration.test.mjs'
      - 'tests/sentinel-671-adaptive-direct-trajectory.test.mjs'
      - 'tests/sentinel-v13460-forecast-countdown.test.mjs'
      - 'tests/sentinel-vnext-ui-1359.test.mjs'
      - 'tests/sentinel-perf-mobile-673.test.mjs'
      - 'tests/sentinel-mobile-clock-674.test.mjs'
      - 'tests/sentinel-v134672-adaptive-integration.test.mjs'
      - 'sentinel-trading-lab/agent-launcher.go'
      - 'sentinel-trading-lab/public/downloads/install-agent-v88.ps1'
      - '.github/workflows/sentinel-windows-candidate-13675.yml'

permissions:
  contents: write

concurrency:
  group: sentinel-675-selected-strengths
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install DOM verification dependency
        run: npm install --prefix tests --no-save --no-package-lock --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Verify independent-signal, market totals and live mobile regressions
        run: |
          set -euo pipefail
          node --test tests/sentinel-selected-strengths-675.test.mjs tests/sentinel-specialist-structure-models.test.mjs tests/sentinel-automatic-structure-candidate.test.mjs tests/sentinel-v134672-adaptive-integration.test.mjs tests/sentinel-671-adaptive-direct-trajectory.test.mjs tests/sentinel-13467-overlay-expand-hotfix.test.mjs tests/sentinel-single-engine-contract-1359.test.mjs tests/sentinel-expiry-driven-1359.test.mjs tests/sentinel-forward-forecast-proof-1359.test.mjs tests/sentinel-automatic-forward-model-1359.test.mjs tests/sentinel-specialist-motors-1359.test.mjs tests/sentinel-vnext-runtime-1359.test.mjs tests/sentinel-vnext-ui-1359.test.mjs tests/sentinel-independent-reversal-coexist.test.mjs tests/sentinel-v13460-mobile-realtime-regression.test.mjs tests/sentinel-v13460-forecast-countdown.test.mjs tests/sentinel-v13460-cards-outcomes.test.mjs tests/sentinel-v13464-mobile-feed-continuity.test.mjs tests/sentinel-v13465-rollback.test.mjs tests/sentinel-v13466-multihorizon-forecasts.test.mjs tests/sentinel-v13467-future-entry.test.mjs tests/sentinel-live-bridge.test.mjs tests/sentinel-perf-mobile-673.test.mjs tests/sentinel-mobile-clock-674.test.mjs
          find sentinel-trading-lab/agent -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Build web release without changing desktop or mobile layout
        working-directory: sentinel-trading-lab
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm run build
      - name: Package embedded agent and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          mkdir -p public/downloads
          rm -f public/downloads/agent_payload_v88.zip
          (cd agent && zip -qr ../public/downloads/agent_payload_v88.zip . -x 'node_modules/*' 'worker/data/*' '*.log' '.DS_Store')
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const release=JSON.parse(fs.readFileSync('agent/release.json','utf8'));
          const pkg=JSON.parse(fs.readFileSync('agent/package.json','utf8'));
          if(release.version!=='13.4.67.5'||pkg.version!==release.version)throw Error('release_mismatch');
          const zipSha256=crypto.createHash('sha256').update(fs.readFileSync('public/downloads/agent_payload_v88.zip')).digest('hex');
          fs.writeFileSync('public/downloads/agent-update.json',JSON.stringify({format:'sentinel-agent-update-v1',version:release.version,build:release.build,zipSha256})+'\n');
          NODE
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico agent/worker/sentinel.ico -arch amd64 -o sentinel_icon.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o public/downloads/Sentinel-Agent-Windows.exe agent-launcher.go
          rm -f sentinel_icon.syso
          cp public/downloads/Sentinel-Agent-Windows.exe public/downloads/sentinel-agent-windows.exe
          cp public/downloads/Sentinel-Agent-Windows.exe public/downloads/Sentinel-Agent-13.4.67.5.exe
          test "$(stat -c%s public/downloads/Sentinel-Agent-Windows.exe)" -gt "$(stat -c%s public/downloads/agent_payload_v88.zip)"
          sha256sum public/downloads/agent_payload_v88.zip public/downloads/Sentinel-Agent-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-13.4.67.5-Windows-release
          path: |
            sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe
            sentinel-trading-lab/public/downloads/Sentinel-Agent-13.4.67.5.exe
            sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe
            sentinel-trading-lab/public/downloads/agent_payload_v88.zip
            sentinel-trading-lab/public/downloads/agent-update.json
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sentinel-13.4.67.5-Windows-release
          path: candidate
      - name: Check EXE internal ZIP and installer without modifying existing installation
        shell: pwsh
        env:
          SENTINEL_INSTALL_VERIFY_ONLY: '1'
          SENTINEL_INSTALL_TEST: '1'
          CI: 'true'
        run: |
          $ErrorActionPreference='Stop'
          $exe=Get-ChildItem -Path 'candidate' -Recurse -Filter 'Sentinel-Agent-Windows.exe' | Select-Object -First 1
          if(-not $exe){throw 'Candidate EXE was not uploaded'}
          & $exe.FullName
          if($LASTEXITCODE -ne 0){throw "Embedded Sentinel Agent verification failed: $LASTEXITCODE"}

  publish-branch-candidate:
    needs: windows-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-selected-strengths-675-20261012
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Sentinel-13.4.67.5-Windows-release
          path: candidate
      - name: Publish verified 67.4 files to release branch and retain 67.1 installer
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git ls-remote origin "refs/heads/sentinel-selected-strengths-675-20261012" | cut -f1)" != "$GITHUB_SHA" ]; then
            echo 'Release source changed during verification; refuse stale binary'
            exit 1
          fi
          src=candidate
          test -f "$src/Sentinel-Agent-Windows.exe"
          test -f "$src/agent_payload_v88.zip"
          cp "$src/Sentinel-Agent-Windows.exe" sentinel-trading-lab/public/downloads/
          cp "$src/Sentinel-Agent-13.4.67.5.exe" sentinel-trading-lab/public/downloads/
          cp "$src/sentinel-agent-windows.exe" sentinel-trading-lab/public/downloads/
          cp "$src/agent_payload_v88.zip" sentinel-trading-lab/public/downloads/
          cp "$src/agent-update.json" sentinel-trading-lab/public/downloads/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f sentinel-trading-lab/public/downloads/{Sentinel-Agent-Windows.exe,Sentinel-Agent-13.4.67.5.exe,sentinel-agent-windows.exe,agent_payload_v88.zip,agent-update.json}
          if git diff --cached --quiet; then echo "Candidate binaries already match"; exit 0; fi
          git commit -m 'build(sentinel): verified 13.4.67.5 mobile clock continuity and preserved 67.1 rollback [skip ci] [skip deploy]'
          git push origin HEAD:sentinel-selected-strengths-675-20261012
