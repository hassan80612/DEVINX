name: Build Sentinel Windows Agent

on:
  push:
    branches: [main]
    paths:
      - 'sentinel-trading-lab/agent-launcher.go'
      - '.github/workflows/sentinel-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build Windows Agent
        working-directory: sentinel-trading-lab
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p public/downloads
          go build -trimpath -ldflags="-s -w" -o public/downloads/Sentinel-Agent-Windows.exe agent-launcher.go
          test -s public/downloads/Sentinel-Agent-Windows.exe

      - name: Commit Agent binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe
          if git diff --cached --quiet; then
            echo "Agent binary unchanged."
            exit 0
          fi
          git commit -m "build(sentinel): refresh Windows Agent V8.6"
          git push
