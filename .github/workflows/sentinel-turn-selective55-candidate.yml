name: Sentinel candidate - 55 percent, reversal and latency audit
on:
  push:
    branches:
      - test/turn-awareness-selective55-20261013
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci --ignore-scripts
      - name: Verify syntax of changed runtime code
        run: |
          node --check sentinel-trading-lab/agent/src/core/turn-pressure.mjs
          node --check sentinel-trading-lab/agent/src/core/future-entry-schedule.mjs
          node --check sentinel-trading-lab/agent/src/core/selective-autonomous.mjs
          node --check sentinel-trading-lab/agent/src/core/single-opportunity-window.mjs
          node --check sentinel-trading-lab/agent/worker/index.mjs
          node --check sentinel-trading-lab/agent/worker/local-playwright-driver.mjs
      - name: New 55 percent, reversal and timing regressions
        run: |
          node --test --test-reporter=spec tests/sentinel-turn-awareness-selective55-candidate.test.mjs
      - name: Verify bilingual UI and untouched entry-now behavior
        run: node --test --test-reporter=spec tests/sentinel-ui-i18n-6726-candidate.test.mjs
      - name: Build Sentinel website without deploying
        run: |
          cd sentinel-trading-lab
          NEXT_TELEMETRY_DISABLED=1 ../node_modules/.bin/next build
      - name: Typecheck Sentinel website and mobile components
        run: npx tsc --noEmit --project sentinel-trading-lab/tsconfig.json
      - name: Benchmark selective work against original 67.26
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/sentinel-selective-speed-candidate.mjs /tmp/sentinel-selective-speed-candidate.mjs
          node /tmp/sentinel-selective-speed-candidate.mjs > /tmp/selective-candidate-speed.json
          original=$(git rev-parse HEAD)
          git checkout --detach 7cd0e7315fd7b6a59ad82142ffc8db7491c902ca
          node /tmp/sentinel-selective-speed-candidate.mjs > /tmp/selective-baseline-speed.json
          git checkout --detach "$original"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('/tmp/selective-baseline-speed.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/selective-candidate-speed.json','utf8'));
          console.log('Baseline 67.26 matrix ms:',a.averageMatrixMs);
          console.log('Candidate matrix ms:',b.averageMatrixMs);
          console.log('Baseline single ms:',a.averageSingleMs);
          console.log('Candidate single ms:',b.averageSingleMs);
          NODE
      - name: Compare existing integration failures against unmodified 67.26
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tests/sentinel-selective-live-6726.test.mjs
            tests/sentinel-selective-historical-6718.test.mjs
            tests/sentinel-continuous-real-window-6721.test.mjs
            tests/sentinel-single-opportunity-6720.test.mjs
            tests/sentinel-selective-deadline-6714.test.mjs
            tests/sentinel-entry-window-6719.test.mjs
            tests/sentinel-mobile-canonical-window-6723.test.mjs
            tests/sentinel-lightweight-overlay-no-broker-freeze-6723.test.mjs
            tests/sentinel-live-bridge.test.mjs
            tests/sentinel-1356-engine-card-latency.test.mjs
            tests/sentinel-source-event-pc-mobile-6722.test.mjs
            tests/sentinel-pc-mobile-signed-clock-6724.test.mjs
            tests/sentinel-mobile-low-latency-1357.test.mjs
            tests/sentinel-v13464-mobile-feed-continuity.test.mjs
          )
          original=$(git rev-parse HEAD)
          node --test --test-concurrency=2 --test-reporter=tap "${files[@]}" > candidate.tap 2>&1 || true
          git checkout --detach 7cd0e7315fd7b6a59ad82142ffc8db7491c902ca
          node --test --test-concurrency=2 --test-reporter=tap "${files[@]}" > baseline.tap 2>&1 || true
          git checkout --detach "$original"
          for p in candidate baseline; do
            grep '^not ok [0-9]* - ' "$p.tap" | sed -E 's/^not ok [0-9]+ - //' | sort -u > "$p.fail" || true
            echo "$p existing test failures: $(wc -l < "$p.fail")"
            sed -n '/^# tests /,/^# duration_ms /p' "$p.tap" | tail -n 9
          done
          comm -13 baseline.fail candidate.fail > new.fail || true
          echo "New regressions vs 67.26: $(wc -l < new.fail)"
          cat new.fail
          test ! -s new.fail
