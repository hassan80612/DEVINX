name: Sentinel V12 forecast clean validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/agent-launcher.go'
      - 'sentinel-trading-lab/public/downloads/**'
      - 'sentinel-trading-lab/src/app/page.tsx'
      - '.github/workflows/sentinel-v12-forecast-clean.yml'

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-v12-forecast-clean-20261006
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Syntax
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem 'sentinel-trading-lab/agent' -Recurse -Filter '*.mjs' | ForEach-Object {
            & node --check $_.FullName
            if($LASTEXITCODE -ne 0){throw "Syntax failed: $($_.FullName)"}
          }

      - name: Forecast and asset isolation regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=@'
          import {LocalPlaywrightDriver,instrumentLabel} from './sentinel-trading-lab/agent/worker/local-playwright-driver.mjs';
          import {DemoTradingRuntime} from './sentinel-trading-lab/agent/src/core/runtime.mjs';
          import {analyzeMarket} from './sentinel-trading-lab/agent/src/core/strategy.mjs';
          import {readFile} from 'node:fs/promises';

          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};

          assert(instrumentLabel('Gold Blitz')==='Gold','generic Gold label not detected');
          assert(instrumentLabel('front.com')==null,'false COM label accepted');
          assert(instrumentLabel('new-web-loading-screen')==null,'false app label accepted');

          const driver=new LocalPlaywrightDriver({dataDir:'sentinel-trading-lab/agent/worker/data/forecast-clean-smoke'});
          const st=driver.state('iq_option');
          st.uiSymbol='EUR/USD';st.symbol='EUR/USD';st.activeId=1;st.activeMap.set('EURUSD',1);
          st.candles=Array.from({length:60},(_,i)=>({from:1700000000+i*60,to:1700000060+i*60,open:1,high:1.1,low:.9,close:1}));
          st.quote=1.11702;st.quoteHistory=[{ts:Date.now(),price:1.11702}];st.lastQuoteAt=Date.now();st.lastCandleAt=Date.now();
          assert(driver.applyActiveSelection('iq_option',{symbol:'Gold',source:'click'})===true,'Gold switch rejected');
          assert(st.uiSymbol==='Gold'&&st.symbol==='Gold','Gold not made authoritative');
          assert(st.candles.length===0&&st.quote===null&&st.quoteHistory.length===0,'old asset market state leaked after switch');

          st.uiSymbolSource='dom-active';st.lastUiSignalAt=Date.now();
          driver.ingest('iq_option',JSON.stringify({name:'sendMessage',msg:{name:'get-candles',body:{active_id:1912,size:60}}}),'page-out');
          assert(Number(st.activeMap.get('GOLD'))===1912,'Gold active_id not bound from visible history request');
          assert(Number(st.activeId)===1912&&Number(st.pageActiveId)===1912,'Gold active/page id not synchronized');

          const runtime=new DemoTradingRuntime({seed:7,balance:10000});
          runtime.settings.asset='EUR/USD';
          runtime.lastResult={asset:'EUR/USD',analysis:{entryPlanner:{horizons:{'60':{asset:'EUR/USD',callTrigger:1.1162,putTrigger:1.1173}}}}};
          runtime.setExternalMarket({provider:'iq_option',symbol:'Gold',uiSymbol:'Gold',quote:4132.858,candles:[],quoteHistory:[],feedValidated:false});
          assert(runtime.settings.asset==='GOLD','runtime asset did not change to Gold');
          assert(runtime.lastResult?.asset==='GOLD','old EUR/USD result survived Gold switch');
          assert(!runtime.lastResult?.analysis?.entryPlanner,'old EUR/USD planner survived Gold switch');

          runtime.settings.asset='GOLD';
          const fake={generalConsensus:{side:'PUT'},entryPlanner:{horizons:{'60':{bias:'CALL',confidence:62,modelConfidence:62,outlookReady:true,callProbability:64,putProbability:36}}}};
          runtime._mergeScenarioConfluence(fake,{cards:[]},{price:4132.858},Date.now());
          const plan=fake.entryPlanner.horizons['60'];
          assert(plan.asset==='GOLD','forecast not stamped with current asset');
          assert(plan.executionBias==='CALL','future direction was erased by present consensus');
          assert(plan.entryAligned===false,'divergent present incorrectly marked as aligned');

          const now=Date.now(),base=Math.floor(now/1000)-120*60;
          const candles=Array.from({length:120},(_,i)=>{const o=100+i*.08,c=o+.05;return{from:base+i*60,to:base+(i+1)*60,open:o,high:c+.03,low:o-.03,close:c}});
          const quoteHistory=Array.from({length:30},(_,i)=>({ts:now-29000+i*1000,price:109.5+i*.02}));
          const analysis=analyzeMarket({candles,quoteHistory,strategy:'trend',minConfidence:74,durationMs:60000,freshnessMs:5000,quoteTs:now,now});
          const future=analysis?.entryPlanner?.horizons?.['60'];
          assert(future&&Object.prototype.hasOwnProperty.call(future,'directionReady'),'future direction readiness missing');
          assert(String(future.basis||'').includes('independente'),'future model still described as current-consensus dependent');

          runtime.settings.strategy='trend';runtime.settings.strategy2='none';runtime.settings.strategy3='none';
          const cards=runtime._strategyPanel({candles,quoteHistory,quoteTs:now,price:candles.at(-1).close},now).cards;
          const active=cards.find(x=>x.active);
          assert(active&&Number(active.callPct)+Number(active.putPct)===100,'analyst output not normalized to a directional distribution');
          assert(Number.isFinite(Number(active.evidence))&&active.evidence>=0&&active.evidence<=1,'analyst evidence quality missing');

          const ui=await readFile('./sentinel-trading-lab/agent/worker/local-playwright-driver.mjs','utf8');
          assert(ui.includes('planAsset===overlayAsset'),'overlay lacks cross-asset forecast guard');
          console.log('V12 FORECAST + ASSET ISOLATION: PASS');
          '@
          Set-Content -Path 'sentinel-v12-forecast-clean-smoke.mjs' -Value $script -Encoding UTF8
          node 'sentinel-v12-forecast-clean-smoke.mjs'

      - name: Build artifacts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'sentinel-trading-lab/public/downloads' | Out-Null
          Compress-Archive -Path 'sentinel-trading-lab/agent/*' -DestinationPath 'sentinel-trading-lab/public/downloads/agent_payload_v88.zip' -Force
          go build -trimpath -ldflags="-s -w -buildid=" -o 'sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe' 'sentinel-trading-lab/agent-launcher.go'
          if($LASTEXITCODE -ne 0){throw 'EXE build failed'}
          if(-not (Test-Path 'sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe')){throw 'EXE missing'}
          Write-Host 'V12 FORECAST CLEAN BUILD: PASS'

      - name: Commit artifacts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sentinel-trading-lab/public/downloads/agent_payload_v88.zip sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){Write-Host 'Artifacts unchanged'; exit 0}
          git commit -m "build(sentinel): publish V12 forecast clean Agent"
          git pull --rebase origin sentinel-v12-forecast-clean-20261006
          git push origin HEAD:sentinel-v12-forecast-clean-20261006
