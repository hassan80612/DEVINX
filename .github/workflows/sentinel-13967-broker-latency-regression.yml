name: Sentinel 13.9.67 broker maintenance isolation - candidate tests
on:
  push:
    branches: [perf/sentinel-13967-broker-low-load-signal-priority-20261020]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'tests/sentinel-13967-*'
      - '.github/workflows/sentinel-13967-broker-latency-regression.yml'
permissions: {contents: read}
concurrency:
  group: sentinel-13967-broker-latency
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify broker low-load checks and signal-execution regressions
        run: |
          set -euo pipefail
          find sentinel-trading-lab/agent -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --test tests/sentinel-13967-maintenance-never-delays-signals.test.mjs tests/sentinel-13966-balance-push-no-extra-load.test.mjs tests/sentinel-13966-causal-martingale-recovery.test.mjs tests/sentinel-13965-overlay-throttle.test.mjs tests/sentinel-13963-unresolved-continuity.test.mjs tests/sentinel-13962-handoff-recovery.test.mjs tests/sentinel-13961-nine-click-window.test.mjs tests/sentinel-13960-own-sequence-and-strategy-switch.test.mjs tests/sentinel-13959-decision-integrity-risk.test.mjs tests/sentinel-13957-click-latency-and-broker-cache.test.mjs tests/sentinel-13955-session-and-calculation.test.mjs tests/sentinel-13954-bounded-settlement-recovery.test.mjs tests/sentinel-13953-safe-restart.test.mjs tests/sentinel-13952-continuous-bot.test.mjs tests/sentinel-13951-click-martingale.test.mjs
      - name: Install website dependencies
        run: npm install --prefix sentinel-trading-lab --no-audit --no-fund --package-lock=false
      - name: Website prebuild and TypeScript
        run: |
          npm run prebuild --prefix sentinel-trading-lab
          cd sentinel-trading-lab && npx tsc --noEmit
