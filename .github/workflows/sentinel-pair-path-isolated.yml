name: Sentinel 13.4.74 isolated research (not deployment)
on:
  push:
    branches:
      - sentinel-research-path-combos-20261011
permissions:
  contents: read
jobs:
  test-isolated-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify historical paths and independent engine pair selection
        run: node --test tests/sentinel-v1374-pairs-future-path.test.mjs
