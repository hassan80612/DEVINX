name: Sentinel 13.4.74 isolated research (not deployment)
on:
  push:
    branches:
      - sentinel-research-path-combos-20261011
permissions:
  contents: read
jobs:
  test-isolated-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify historical paths and independent engine pair selection
        run: node --test tests/sentinel-v1374-pairs-future-path.test.mjs tests/sentinel-overlay-pc-disclosures-v1374.test.mjs tests/sentinel-v1374-runtime-gated-pair.test.mjs tests/sentinel-v1374-pairs-walkforward.test.mjs tests/sentinel-v1374-regime-forecast.test.mjs tests/sentinel-180s-all-strategies.test.mjs tests/sentinel-180s-holdout.test.mjs tests/sentinel-3min-global-shadow.test.mjs
