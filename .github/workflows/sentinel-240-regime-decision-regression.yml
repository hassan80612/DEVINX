name: Sentinel 240 Trend-vs-Range and Pre-spike Arbitration
on:
  push:
    branches:
      - fix/sentinel-240-directional-vs-range-classification-20261103
    paths:
      - '.github/workflows/sentinel-240-regime-decision-regression.yml'
      - 'sentinel-trading-lab/agent/src/core/decisive-market-regime-240.mjs'
      - 'sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs'
      - 'sentinel-trading-lab/agent/src/core/first-wave-counterturn-237.mjs'
      - 'sentinel-trading-lab/agent/src/core/market-reading.mjs'
      - 'tests/sentinel-240-regime-first-wave.test.mjs'
      - 'tests/sentinel-240-live-one-minute-countercandle.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify decisive direction, 30s/1m reversal and native expiry
        shell: bash
        run: |
          set -euo pipefail
          node --check sentinel-trading-lab/agent/src/core/decisive-market-regime-240.mjs
          node --check sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs
          node --check sentinel-trading-lab/agent/src/core/market-reading.mjs
          node --test tests/sentinel-107-range-preservation.test.mjs tests/sentinel-202-reversal-review-freshness.test.mjs node --test tests/sentinel-240-live-one-minute-countercandle.test.mjs tests/sentinel-240-regime-first-wave.test.mjs tests/sentinel-239-pre-spike-arbitration.test.mjs tests/sentinel-237-first-wave-arbitration.test.mjs tests/sentinel-236-multilevel-reversal-recognition.test.mjs tests/sentinel-238-no-30s-rollback.test.mjs tests/sentinel-range-pivot-trend-20261022.test.mjs tests/sentinel-228-market-reading-recovery.test.mjs
