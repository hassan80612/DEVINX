name: Sentinel Reliability Candidate

on:
  push:
    branches:
      - sentinel-professional-reliability-20261010
  pull_request:
    branches:
      - sentinel-premium-ux-cleanup-20261010

permissions:
  contents: read

jobs:
  test-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies (no scripts)
        run: npm ci --ignore-scripts
      - name: Validate agent syntax
        run: |
          find sentinel-trading-lab/agent/src/core -name '*.mjs' -type f -print0 | xargs -0 -n1 node --check
          node --check sentinel-trading-lab/agent/worker/index.mjs
      - name: Verify Sentinel core and regression tests
        run: node --test tests/sentinel*.test.mjs
