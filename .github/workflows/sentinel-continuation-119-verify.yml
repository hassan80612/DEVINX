name: Sentinel 119 continuation room regression - NO DEPLOY
on:
  push:
    branches: [fix/sentinel-119-continuation-room-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check sentinel-trading-lab/agent/src/core/continuation-room-risk.mjs
          node --check sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs
          node --check tests/sentinel-continuation-room-119.test.mjs
      - name: Run scope and unchanged reversal/continuation regression
        run: |
          node --test --test-concurrency=1 \
            tests/sentinel-continuation-room-119.test.mjs \
            tests/sentinel-118-reversal-price-authority.test.mjs \
            tests/sentinel-13996-verified-wall-exhaustion.test.mjs \
            tests/sentinel-139107-causal-rejection-six-expiry.test.mjs \
            tests/sentinel-current-reversal-20261025.test.mjs \
            tests/sentinel-reversal-structure.test.mjs \
            tests/sentinel-observed-level-sequence.test.mjs \
            tests/sentinel-selected-strategy-authority.test.mjs \
            tests/sentinel-13992-all-expiry-trend-reversal.test.mjs \
            tests/sentinel-shared-pivot-guard-20261022.test.mjs \
            tests/sentinel-trade-audit-20261024.test.mjs
