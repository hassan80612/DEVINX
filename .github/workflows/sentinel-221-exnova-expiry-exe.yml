name: Sentinel 222 Verified Windows EXE
# Guarded 222 executor SHA validated by the historical baseline test.

on:
  push:
    branches:
      - fix/sentinel-221-github-direct-no-vercel-hop-20261102
    paths:
      - .github/workflows/sentinel-221-exnova-expiry-exe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sentinel-222-verified-agent
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Validate 222 entry safety, independent probability and old expiry
        shell: bash
        run: |
          set -euo pipefail
          find sentinel-trading-lab/agent -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --test tests/sentinel-222-last-mile-evidence.test.mjs tests/sentinel-222-calibration-provenance.test.mjs tests/sentinel-221-expiry-native-durable.test.mjs tests/sentinel-199-expiry-last-choice.test.mjs tests/sentinel-201-closed-price-admission.test.mjs tests/sentinel-trade-audit-20261024.test.mjs
      - name: Build self-contained 222 Windows EXE and direct versioned asset
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          mkdir -p public/downloads
          (cd agent && zip -qr ../public/downloads/agent_payload_v88.zip . -x 'node_modules/*' 'worker/data/*' '*.log' '.DS_Store')
          export RELEASE_SHA="$(sha256sum public/downloads/agent_payload_v88.zip | cut -d' ' -f1)"
          python3 -c 'import json,os; r=json.load(open("agent/release.json")); assert r["version"]=="13.9.222"; print(json.dumps({"format":"sentinel-agent-update-v1","version":r["version"],"build":r["build"],"zipSha256":os.environ["RELEASE_SHA"]},separators=(",",":")))' > public/downloads/agent-update.json
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico agent/worker/sentinel.ico -arch amd64 -o sentinel_icon.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o public/downloads/Sentinel-Agent-Windows.exe agent-launcher.go
          rm -f sentinel_icon.syso
          cp public/downloads/Sentinel-Agent-Windows.exe public/downloads/sentinel-agent-windows.exe
          cp public/downloads/Sentinel-Agent-Windows.exe public/downloads/Sentinel-Agent-13.9.222.exe
          node --test ../tests/sentinel-222-release-exe-contract.test.mjs
          sha256sum public/downloads/Sentinel-Agent-Windows.exe public/downloads/Sentinel-Agent-13.9.222.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-222-windows-validated-assets
          path: |
            sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.222.exe
            sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe
            sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe
            sentinel-trading-lab/public/downloads/agent_payload_v88.zip
            sentinel-trading-lab/public/downloads/agent-update.json
          if-no-files-found: error

  verify-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-222-windows-validated-assets
          path: output
      - name: Run the actual EXE and verify bundled installer/payload safely on Windows
        shell: pwsh
        env:
          SENTINEL_INSTALL_VERIFY_ONLY: '1'
          SENTINEL_INSTALL_TEST: '1'
          CI: 'true'
        run: |
          $exe = Join-Path $PWD 'output/Sentinel-Agent-13.9.222.exe'
          if (-not (Test-Path $exe)) { throw 'Missing 222 Windows EXE' }
          & $exe
          if ($LASTEXITCODE -ne 0) { throw "Sentinel 222 Windows executable failed verification: $LASTEXITCODE" }

  publish:
    needs: verify-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-222-windows-validated-assets
          path: sentinel-trading-lab/public/downloads
      - name: Publish Windows-tested EXE to isolated Sentinel branch
        shell: bash
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          remote="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "Source branch changed during Windows verification; refusing stale installer."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.222.exe sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe sentinel-trading-lab/public/downloads/agent_payload_v88.zip sentinel-trading-lab/public/downloads/agent-update.json
          git diff --cached --quiet && exit 0
          git commit -m "build(sentinel 222): Windows-smoke-tested same-origin EXE and full Agent package"
          git push origin "HEAD:$branch"
