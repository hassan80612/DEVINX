name: Archive verified Sentinel 13.9.221 Windows EXE

on:
  push:
    branches:
      - fix/sentinel-221-exe-github-20261102
    paths:
      - .github/workflows/sentinel-221-exe-archive.yml

permissions:
  contents: read

jobs:
  archive-windows-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the exact release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Retrieve and verify the original 221 installer
        run: |
          set -euo pipefail
          install -d sentinel-trading-lab/public/downloads
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            'https://trading.devinx.com.br/downloads/Sentinel-Agent-13.9.221.exe?build=13.9.221-h207-unified-native-expiry-durable' \
            --output sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.221.exe
          test "$(wc -c < sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.221.exe)" -eq 2851840
          echo '41895d937e311f82d062dc5e2dc414e531f92f0d1b2863ab0614e8c135aa4772  sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.221.exe' | sha256sum --check -
          test "$(od -An -tx1 -N2 sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.221.exe | tr -d ' \n')" = '4d5a'
      - name: Commit immutable EXE copy to GitHub
        run: |
          set -euo pipefail
          git config user.name 'sentinel-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.221.exe
          git commit -m 'archive(sentinel): verified original 13.9.221 EXE, SHA256 41895d93'
          git push origin HEAD:fix/sentinel-221-exe-github-20261102
