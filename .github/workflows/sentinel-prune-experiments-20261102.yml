name: Prune superseded Sentinel experiment branches
on:
  push:
    branches:
      - chore/sentinel-207-cleanup-20261102
    paths:
      - .github/workflows/sentinel-prune-experiments-20261102.yml
permissions:
  contents: write
concurrency:
  group: sentinel-branch-prune-20261102
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Confirm exact repository and protected heads
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "hassan80612/DEVINX"
          test "$GITHUB_REF_NAME" = "chore/sentinel-207-cleanup-20261102"
          for branch in "archive/sentinel-168-preserved-20261102" "archive/sentinel-207-preserved-20261102" "archive/sentinel-218-preserved-20261102" "chore/sentinel-207-cleanup-20261102"; do
            gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq .name >/dev/null
          done
      - name: Snapshot all branch names and exact commit SHAs
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[] | [.name,.commit.sha] | @tsv' > sentinel-branches-before.tsv
          echo "Snapshot branches: $(wc -l < sentinel-branches-before.tsv)"
          mkdir -p cleanup-results
          cp sentinel-branches-before.tsv cleanup-results/
      - name: Delete only superseded Sentinel-prefixed branches
        shell: bash
        run: |
          set -euo pipefail
          deleted=0
          failed=0
          : > cleanup-results/deleted.txt
          : > cleanup-results/failed.txt
          while IFS=$'\t' read -r branch sha; do
            case "$branch" in
              main|archive/sentinel-168-preserved-20261102|archive/sentinel-207-preserved-20261102|archive/sentinel-218-preserved-20261102|chore/sentinel-207-cleanup-20261102)
                continue ;;
              sentinel-*|*/sentinel-*)
                if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1; then
                  printf '%s\t%s\n' "$branch" "$sha" >> cleanup-results/deleted.txt
                  deleted=$((deleted+1))
                else
                  printf '%s\t%s\n' "$branch" "$sha" >> cleanup-results/failed.txt
                  failed=$((failed+1))
                fi
                sleep 0.25 ;;
              *) continue ;;
            esac
          done < sentinel-branches-before.tsv
          echo "Deleted Sentinel branches: $deleted; failed or protected: $failed"
          printf 'deleted=%s\nfailed=%s\n' "$deleted" "$failed" > cleanup-results/summary.txt
          test "$deleted" -gt 0
      - name: Verify all protected heads remain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for branch in "archive/sentinel-168-preserved-20261102" "archive/sentinel-207-preserved-20261102" "archive/sentinel-218-preserved-20261102" "chore/sentinel-207-cleanup-20261102"; do
            gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq .name
          done
      - name: Retain reversible deletion audit as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-branch-cleanup-20261102
          path: cleanup-results/
          retention-days: 90
