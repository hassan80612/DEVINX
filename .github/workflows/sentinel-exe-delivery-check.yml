name: Sentinel EXE public download integrity
on:
  push:
    branches: [sentinel-exe-delivery-check-1008]
    paths: ['.github/workflows/sentinel-exe-delivery-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-exe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check original release EXE
        shell: bash
        run: |
          set -euo pipefail
          localfile="sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe"
          test -s "$localfile" || { echo 'ORIGINAL_EXE_MISSING'; exit 11; }
          file "$localfile"
          test "$(od -An -tx1 -N2 "$localfile" | tr -d ' \n')" = "4d5a" || { echo 'INVALID_PE_HEADER'; exit 12; }
          echo "ORIGINAL_EXE_BYTES=$(wc -c < "$localfile")"
          echo "ORIGINAL_EXE_SHA256=$(sha256sum "$localfile" | cut -d' ' -f1)"
      - name: Verify public response and full binary integrity
        shell: bash
        run: |
          set -euo pipefail
          url="https://sentinel-trading-lab.vercel.app/downloads/sentinel-agent-windows.exe?v=13.4.22-expiry-retrace-1008"
          localfile="sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe"
          echo '--- HTTP HEAD ---'
          curl -sSIL --max-time 30 --connect-timeout 10 "$url" | sed -n '1,50p'
          echo '--- FULL GET ---'
          curl --location --fail-with-body --show-error --silent --retry 1 --retry-delay 2 --connect-timeout 10 --max-time 70 --dump-header "$RUNNER_TEMP/exe-http-headers" --output "$RUNNER_TEMP/public-agent.exe" --write-out 'HTTP_STATUS=%{http_code} CONTENT_TYPE=%{content_type} DOWNLOADED_BYTES=%{size_download} EFFECTIVE_URL=%{url_effective}\n' "$url"
          sed -n '1,50p' "$RUNNER_TEMP/exe-http-headers"
          echo "PUBLIC_EXE_BYTES=$(wc -c < "$RUNNER_TEMP/public-agent.exe")"
          echo "PUBLIC_EXE_SHA256=$(sha256sum "$RUNNER_TEMP/public-agent.exe" | cut -d' ' -f1)"
          cmp -s "$localfile" "$RUNNER_TEMP/public-agent.exe" || { echo 'PUBLIC_EXE_CONTENT_MISMATCH'; exit 21; }
          echo 'VERIFIED_PUBLIC_EXE_MATCHES_GITHUB_ORIGINAL'

  verify-windows-download:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify download with Windows native HTTP stack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://sentinel-trading-lab.vercel.app/downloads/sentinel-agent-windows.exe?v=13.4.22-expiry-retrace-1008'
          $local='sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe'
          $dest=Join-Path $env:RUNNER_TEMP 'sentinel-windows-download.exe'
          $response=Invoke-WebRequest -Uri $url -Method Get -OutFile $dest -PassThru
          Write-Output "WINDOWS_HTTP_STATUS=$($response.StatusCode)"
          Write-Output "WINDOWS_DOWNLOAD_BYTES=$((Get-Item $dest).Length)"
          $expected=(Get-FileHash $local -Algorithm SHA256).Hash.ToLowerInvariant()
          $actual=(Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "WINDOWS_EXPECTED_SHA256=$expected"
          Write-Output "WINDOWS_PUBLIC_SHA256=$actual"
          if($expected -ne $actual){throw 'WINDOWS_DOWNLOAD_SHA256_MISMATCH'}
          $sig=Get-AuthenticodeSignature -FilePath $dest
          Write-Output "WINDOWS_AUTHENTICODE_STATUS=$($sig.Status)"
          Write-Output 'VERIFIED_WINDOWS_DOWNLOAD_MATCHES_GITHUB_ORIGINAL'
      - name: Verify actual Microsoft Edge browser download
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --prefix sentinel-trading-lab/agent --ignore-scripts --no-audit --no-fund
          @'
          import {chromium} from './sentinel-trading-lab/agent/node_modules/playwright-core/index.mjs';
          import {readFile, mkdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const url='https://sentinel-trading-lab.vercel.app/downloads/sentinel-agent-windows.exe?v=13.4.22-expiry-retrace-1008';
          const expected=await readFile('sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe');
          const browser=await chromium.launch({channel:'msedge',headless:true});
          try{
            const context=await browser.newContext({acceptDownloads:true});
            const page=await context.newPage();
            await page.goto('https://sentinel-trading-lab.vercel.app/login',{waitUntil:'domcontentloaded',timeout:25000});
            const [download]=await Promise.all([
              page.waitForEvent('download',{timeout:35000}),
              page.evaluate(u=>{const a=document.createElement('a');a.href=u;a.download='sentinel-agent-windows.exe';document.body.appendChild(a);a.click();},url)
            ]);
            const failure=await download.failure();
            console.log('EDGE_DOWNLOAD_SUGGESTED_FILENAME='+download.suggestedFilename());
            console.log('EDGE_DOWNLOAD_FAILURE='+(failure||'none'));
            if(failure)throw new Error('EDGE_DOWNLOAD_FAILED: '+failure);
            const path=await download.path();
            const payload=await readFile(path);
            const hash=b=>createHash('sha256').update(b).digest('hex');
            console.log('EDGE_DOWNLOAD_BYTES='+payload.length);
            console.log('EDGE_DOWNLOAD_SHA256='+hash(payload));
            if(hash(payload)!==hash(expected))throw new Error('EDGE_SHA256_MISMATCH');
            console.log('EDGE_DOWNLOAD_FULL_EXE_VERIFIED');
          }finally{await browser.close();}
          '@ | Set-Content -Encoding UTF8 'edge-download-check.mjs'
          node edge-download-check.mjs
