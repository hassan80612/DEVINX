name: Sentinel 223 Windows Agent Verified Release
# Protected native-expiry bridge SHA now pinned in historical regression.
on:
  push:
    branches:
      - fix/sentinel-221-github-direct-no-vercel-hop-20261102
    paths:
      - .github/workflows/sentinel-223-verified-agent.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sentinel-223-agent
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Verify 223 source, 30s parity, reversal and durable native expiry
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'JSON.parse(require("fs").readFileSync("sentinel-trading-lab/agent/release.json")).version')" = 13.9.223
          node --check sentinel-trading-lab/agent/worker/broker-native-expiry-keeper.mjs
          node --check sentinel-trading-lab/agent/worker/local-playwright-driver.mjs
          node --check sentinel-trading-lab/agent/src/core/pre-entry-risk-review.mjs
          node --test tests/sentinel-222-30s-parity-pre-entry.test.mjs tests/sentinel-222-card-stability-broker-support.test.mjs tests/sentinel-221-expiry-native-durable.test.mjs tests/sentinel-199-expiry-last-choice.test.mjs tests/sentinel-222-last-mile-evidence.test.mjs tests/sentinel-222-calibration-provenance.test.mjs tests/sentinel-204-pre-entry-reviewer.test.mjs tests/sentinel-201-closed-price-admission.test.mjs tests/sentinel-196-189-decisions-expiry-preserved.test.mjs
      - name: Build 223 Windows executable and matching Agent archive
        shell: bash
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          mkdir -p public/downloads
          (cd agent && zip -qr ../public/downloads/agent_payload_v88.zip . -x 'node_modules/*' 'worker/data/*' '*.log' '.DS_Store')
          export RELEASE_SHA="$(sha256sum public/downloads/agent_payload_v88.zip | cut -d' ' -f1)"
          python3 -c 'import json,os; r=json.load(open("agent/release.json")); assert r["version"]=="13.9.223"; print(json.dumps({"format":"sentinel-agent-update-v1","version":r["version"],"build":r["build"],"zipSha256":os.environ["RELEASE_SHA"]},separators=(",",":")))' > public/downloads/agent-update.json
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico agent/worker/sentinel.ico -arch amd64 -o sentinel_icon.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o public/downloads/Sentinel-Agent-Windows.exe agent-launcher.go
          rm sentinel_icon.syso
          cp public/downloads/Sentinel-Agent-Windows.exe public/downloads/sentinel-agent-windows.exe
          cp public/downloads/Sentinel-Agent-Windows.exe public/downloads/Sentinel-Agent-13.9.223.exe
          node --test ../tests/sentinel-222-release-exe-contract.test.mjs
          sha256sum public/downloads/Sentinel-Agent-13.9.223.exe public/downloads/agent_payload_v88.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-223-tested-agent
          if-no-files-found: error
          path: |
            sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.223.exe
            sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe
            sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe
            sentinel-trading-lab/public/downloads/agent_payload_v88.zip
            sentinel-trading-lab/public/downloads/agent-update.json
  verify-on-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-223-tested-agent
          path: output
      - name: Execute 223 real Windows binary in noninstalling verify mode
        shell: pwsh
        env:
          SENTINEL_INSTALL_VERIFY_ONLY: '1'
          SENTINEL_INSTALL_TEST: '1'
          CI: 'true'
        run: |
          $exe=Join-Path $PWD 'output/Sentinel-Agent-13.9.223.exe'
          if(-not (Test-Path $exe)){throw 'Missing 223 Windows EXE'}
          & $exe
          if($LASTEXITCODE -ne 0){throw "223 Agent Windows verification failed: $LASTEXITCODE"}
  publish-assets:
    needs: verify-on-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-223-tested-agent
          path: sentinel-trading-lab/public/downloads
      - name: Publish only verified 223 Agent assets
        shell: bash
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          remote="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          if [ "$remote" != "$GITHUB_SHA" ]; then echo "Branch moved; stale EXE not published."; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.223.exe sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe sentinel-trading-lab/public/downloads/agent_payload_v88.zip sentinel-trading-lab/public/downloads/agent-update.json
          git diff --cached --quiet && exit 0
          git commit -m "build(sentinel 223): validated Windows Agent with expiry, 30s and reversals fixes"
          git push origin "HEAD:$branch"
