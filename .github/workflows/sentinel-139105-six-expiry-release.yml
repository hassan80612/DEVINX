name: Sentinel 13.9.105 NOW provenance Windows candidate - NO PRODUCTION
on:
  push:
    branches:
      - release/sentinel-139105-six-expiry-evidence-20261024
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/package.json'
      - 'sentinel-trading-lab/next.config.mjs'
      - 'sentinel-trading-lab/scripts/**'
      - 'tests/sentinel-trade-audit-20261024.test.mjs'
      - 'tests/sentinel-market-base-competing-path-study-20261024.test.mjs'
      - '.github/workflows/sentinel-139105-six-expiry-release.yml'
permissions:
  contents: read
concurrency:
  group: sentinel-139105-six-expiry-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Syntax check the entire Agent before packaging
        run: find sentinel-trading-lab/agent -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Validate current-tick provenance and real executor path
        run: node --test --test-concurrency=1 tests/sentinel-trade-audit-20261024.test.mjs
      - name: Check six-expiry causal study and isolated market base
        run: node --test tests/sentinel-market-base-competing-path-study-20261024.test.mjs tests/sentinel-13931-historical-structure.test.mjs tests/sentinel-oneway-pivot-guard-20261023.test.mjs tests/sentinel-shared-pivot-guard-20261022.test.mjs
      - name: Check release and native-expiry version contracts
        run: node --test tests/sentinel-13996-verified-wall-exhaustion.test.mjs tests/sentinel-13999-native-expiry-keeper.test.mjs tests/sentinel-139100-broker-history-recovery.test.mjs
      - name: Confirm no live entry or broker execution changes since 13.9.104
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 0ab0a3fb5f48645be8c474088353981eebcf4b4a
          git diff --name-only 0ab0a3fb5f48645be8c474088353981eebcf4b4a HEAD |
            grep -E '(^supabase/|^sentinel-trading-lab/(db|migrations|agent/src/core|agent/worker/|src/app/api)/)' |
            grep -v -e '^sentinel-trading-lab/agent/src/core/competing-market-path-study.mjs$' -e '^sentinel-trading-lab/agent/src/core/runtime.mjs$' -e '^sentinel-trading-lab/agent/src/core/historical-price-structure.mjs$' -e '^sentinel-trading-lab/agent/worker/index.mjs$' -e '^sentinel-trading-lab/agent/worker/trade-audit.mjs$' > /tmp/unsafe.txt || true
          if test -s /tmp/unsafe.txt; then cat /tmp/unsafe.txt; exit 1; fi
          echo 'Only read-only shadow evaluation and trade-audit linking were added.'
      - name: Install web dependencies for isolated build
        run: npm install --prefix sentinel-trading-lab --no-audit --no-fund --package-lock=false
      - name: Build site and exact Windows Agent payload without publishing
        run: npm run build --prefix sentinel-trading-lab
      - name: Verify installer files and update manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          root=Path('sentinel-trading-lab')
          agent=root/'agent'
          downloads=root/'public/downloads'
          release=json.loads((agent/'release.json').read_text())
          manifest=json.loads((downloads/'agent-update.json').read_text())
          assert release['version']=='13.9.105'
          assert release['build']=='13.9.105-six-expiry-causal-evidence'
          assert manifest['format']=='sentinel-agent-update-v1'
          assert manifest['version']==release['version'] and manifest['build']==release['build']
          payload=(downloads/'agent_payload_v88.zip').read_bytes()
          assert manifest['zipSha256']==hashlib.sha256(payload).hexdigest()
          exe=downloads/'Sentinel-Agent-13.9.105.exe'
          content=exe.read_bytes()
          assert content[:2]==b'MZ' and len(content)>1_000_000
          assert payload in content
          assert (downloads/'Sentinel-Agent-Windows.exe').read_bytes()==content
          with zipfile.ZipFile(downloads/'agent_payload_v88.zip') as z:
            assert z.testzip() is None
            assert json.loads(z.read('release.json'))==release
            for name in z.namelist():
              if name.endswith('/'):continue
              assert z.read(name)==(agent/name).read_bytes(),name
          print('CANDIDATE VERIFIED',release['version'],len(content),
                hashlib.sha256(content).hexdigest(),len(payload))
          PY
