name: Sentinel 216 EXE preview public hash parity
on:
  push:
    branches: [diagnostic/sentinel-216-download-http-20261101]
    paths: [.github/workflows/sentinel-216-download-probe.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check preview EXE is byte-exact to GitHub CI Windows build
        shell: bash
        run: |
          set -euo pipefail
          base='https://sentinel-trading-pibax3pi6-iguassu-shop.vercel.app/downloads'
          for p in Sentinel-Agent-13.9.216.exe sentinel-agent-windows.exe agent-update.json; do
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 50 -D "/tmp/$p.headers" -o "/tmp/$p" "$base/$p"
            echo "URL $p:"
            grep -iE '^(HTTP/|content-type:|content-length:|content-disposition:)' "/tmp/$p.headers" | tail -7
            sha256sum "/tmp/$p"
          done
          echo '0f9c9e68cd6e7f8abe0fc6763a770471281c1adf44eabfb8117e5cfd4507b78d  /tmp/Sentinel-Agent-13.9.216.exe' | sha256sum --check
          cmp /tmp/Sentinel-Agent-13.9.216.exe /tmp/sentinel-agent-windows.exe
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/agent-update.json'))
          assert j['version']=='13.9.216'
          assert j['zipSha256']=='9aa8b13725c8906765dfa97a7eb6b97f5c4a3d588de41d7ed05446817d0d0835'
          print('PASS: preview EXACT GH tested EXE and manifest')
          PY
