name: Sentinel 216 public download integrity probe
on:
  push:
    branches: [diagnostic/sentinel-216-download-http-20261101]
    paths: [.github/workflows/sentinel-216-download-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify public installer and alternate ZIP independently of authenticated update API
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          base='https://trading.devinx.com.br/downloads'
          for name in sentinel-agent-windows.exe Sentinel-Agent-13.9.216.exe Sentinel-Agent-13.9.216-Alternativo.zip agent-update.json; do
            curl -fLsS --max-time 65 -o "$name" -w "$name http=%{http_code} bytes=%{size_download}\n" "$base/$name"
          done
          python3 - <<'PY'
          import json,hashlib,zipfile,io,pathlib,sys
          manifest=json.loads(pathlib.Path('agent-update.json').read_text())
          exe=pathlib.Path('sentinel-agent-windows.exe').read_bytes()
          versioned=pathlib.Path('Sentinel-Agent-13.9.216.exe').read_bytes()
          alt=pathlib.Path('Sentinel-Agent-13.9.216-Alternativo.zip')
          digest=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(alt) as z:
            members=z.namelist()
            embedded=z.read('agent_payload_v88.zip')
            print('alternate archive members',members)
            print('alternate archive integrity',z.testzip())
          with zipfile.ZipFile(io.BytesIO(embedded)) as z:
            pkg=json.loads(z.read('package.json'))
            rel=json.loads(z.read('release.json'))
            print('embedded payload integrity',z.testzip())
          report={'manifestVersion':manifest['version'],'pkgVersion':pkg['version'],'releaseVersion':rel['version'],
                  'manifestPayloadSha':manifest['zipSha256'],'embeddedPayloadSha':digest(embedded),
                  'manifestMatchesArchive':manifest['zipSha256']==digest(embedded),
                  'versionedExeMatchesAlias':exe==versioned,
                  'exeContainsPublishedPayload':exe.find(embedded)>=0,
                  'exeSize':len(exe)}
          print(json.dumps(report,indent=2))
          assert all([manifest['version']==pkg['version']==rel['version']=='13.9.216',
            report['manifestMatchesArchive'],report['versionedExeMatchesAlias'],
            report['exeContainsPublishedPayload']]),'The publicly delivered files are inconsistent'
          print('PASS: delivered EXE, alternate ZIP and update metadata match')
          PY
