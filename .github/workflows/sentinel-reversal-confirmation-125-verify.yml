name: Sentinel 125 precise current pivot and fast V - NO DEPLOY
on:
  push:
    branches: [fix/sentinel-139125-confirmed-pivot-and-retreat-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate changed modules
        run: |
          node --check sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs
          node --check sentinel-trading-lab/agent/src/core/fast-level-reversal.mjs
          node --check sentinel-trading-lab/agent/src/core/observed-level-sequence.mjs
          node --check sentinel-trading-lab/agent/src/core/opposite-pivot-break-risk.mjs
      - name: Regression suite for realtime direction and unchanged features
        run: |
          node --test --test-concurrency=1 \
            tests/sentinel-reversal-confirmation-125.test.mjs \
            tests/sentinel-fast-level-reversal-121.test.mjs \
            tests/sentinel-fast-reversal-121.test.mjs \
            tests/sentinel-observed-level-sequence.test.mjs \
            tests/sentinel-118-reversal-price-authority.test.mjs \
            tests/sentinel-continuation-room-119.test.mjs \
            tests/sentinel-13996-verified-wall-exhaustion.test.mjs \
            tests/sentinel-139107-causal-rejection-six-expiry.test.mjs \
            tests/sentinel-current-reversal-20261025.test.mjs \
            tests/sentinel-13999-native-expiry-keeper.test.mjs \
            tests/sentinel-139100-broker-history-recovery.test.mjs
