name: Sentinel 125 precise current pivot and fast V - NO DEPLOY
on:
  push:
    branches: [fix/sentinel-139125-confirmed-pivot-and-retreat-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate changed modules
        run: |
          node --check sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs
          node --check sentinel-trading-lab/agent/src/core/fast-level-reversal.mjs
          node --check sentinel-trading-lab/agent/src/core/observed-level-sequence.mjs
          node --check sentinel-trading-lab/agent/src/core/opposite-pivot-break-risk.mjs
      - name: Regression suite for realtime direction and unchanged features
        run: |
          node --test --test-concurrency=1 \
            tests/sentinel-reversal-confirmation-125.test.mjs \
            tests/sentinel-fast-level-reversal-121.test.mjs \
            tests/sentinel-fast-reversal-121.test.mjs \
            tests/sentinel-observed-level-sequence.test.mjs \
            tests/sentinel-118-reversal-price-authority.test.mjs \
            tests/sentinel-continuation-room-119.test.mjs \
            tests/sentinel-13996-verified-wall-exhaustion.test.mjs \
            tests/sentinel-139107-causal-rejection-six-expiry.test.mjs \
            tests/sentinel-current-reversal-20261025.test.mjs \
            tests/sentinel-13999-native-expiry-keeper.test.mjs \
            tests/sentinel-139100-broker-history-recovery.test.mjs
      - name: Install dependencies
        run: npm install --prefix sentinel-trading-lab --no-audit --no-fund --package-lock=false
      - name: Build full production website and real Windows Agent
        run: npm run build --prefix sentinel-trading-lab
      - name: Verify Windows installer and auto-update ZIP 125
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('sentinel-trading-lab')
          release=json.loads((root/'agent/release.json').read_text())
          assert release['version']=='13.9.125',release
          assert release['build']=='13.9.125-confirmed-pivot-break-fast-reversal'
          dl=root/'public/downloads'
          manifest=json.loads((dl/'agent-update.json').read_text())
          assert manifest['version']==release['version'] and manifest['build']==release['build']
          payload=(dl/'agent_payload_v88.zip').read_bytes()
          assert hashlib.sha256(payload).hexdigest()==manifest['zipSha256']
          exe=(dl/'Sentinel-Agent-13.9.125.exe').read_bytes()
          assert exe[:2]==b'MZ' and len(exe)>1_000_000 and payload in exe
          assert exe==(dl/'Sentinel-Agent-Windows.exe').read_bytes()
          with zipfile.ZipFile(dl/'agent_payload_v88.zip') as z:
            assert z.testzip() is None
            assert json.loads(z.read('release.json'))==release
            for path in z.namelist():
              if path.endswith('/'):continue
              assert z.read(path)==(root/'agent'/path).read_bytes(),path
          print('SENTINEL 125 VERIFIED',len(exe),manifest['zipSha256'])
          PY
