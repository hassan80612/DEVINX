name: Sentinel 13.9.107 causal expiry research (NO DEPLOY)
on:
  push:
    branches:
      - fix/sentinel-139107-causal-reaction-20261024
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check sentinel-trading-lab/agent/src/core/causal-level-rejection-proof.mjs
          node --check sentinel-trading-lab/agent/src/core/historical-price-structure.mjs
          node --check sentinel-trading-lab/agent/src/core/runtime.mjs
          node --check sentinel-trading-lab/agent/worker/trade-audit.mjs
      - name: Test expiry proof on all six durations
        run: node --test tests/sentinel-139107-causal-rejection-six-expiry.test.mjs
      - name: Test regressions of broker-verified structure and base
        run: |
          node --test tests/sentinel-13931-historical-structure.test.mjs tests/sentinel-13992-all-expiry-trend-reversal.test.mjs tests/sentinel-shared-pivot-guard-20261022.test.mjs tests/sentinel-oneway-pivot-guard-20261023.test.mjs tests/sentinel-13957-stage5-level-priority-and-martingale3.test.mjs tests/sentinel-trade-audit-20261024.test.mjs
      - name: Audit changed file whitelist
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 7b001ba735cbf5c59b8ac0d6f5cc9f067c3b8a27
          git diff --name-only 7b001ba735cbf5c59b8ac0d6f5cc9f067c3b8a27 HEAD | grep -E '^sentinel-trading-lab/(agent/|src/app/api/|src/components/)' | grep -v -e '^sentinel-trading-lab/agent/src/core/historical-price-structure.mjs$' -e '^sentinel-trading-lab/agent/src/core/causal-level-rejection-proof.mjs$' -e '^sentinel-trading-lab/agent/src/core/runtime.mjs$' -e '^sentinel-trading-lab/agent/worker/trade-audit.mjs$' > /tmp/unsafe || true
          if test -s /tmp/unsafe; then cat /tmp/unsafe; exit 1; fi
          echo 'No changes to broker, stops, martingale, UI or database.'
