name: Sentinel staging artifact build

on:
  push:
    branches: [sentinel-visible-asset-fix-20261006]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/agent-launcher.go'
      - 'sentinel-trading-lab/public/downloads/install-agent-v88.ps1'
      - '.github/workflows/sentinel-staging-artifact.yml'

permissions:
  contents: write

jobs:
  build-artifacts:
    runs-on: windows-latest
    env:
      SENTINEL_SUPABASE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-visible-asset-fix-20261006
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Validate false asset parser
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem 'sentinel-trading-lab/agent' -Recurse -Filter '*.mjs' | ForEach-Object {
            & node --check $_.FullName
            if($LASTEXITCODE -ne 0){throw "Syntax failed: $($_.FullName)"}
          }
          $script=@'
          import {instrumentLabel} from './sentinel-trading-lab/agent/worker/local-playwright-driver.mjs';
          for(const x of ['COM/GTM','TRY/ING','WWW/API','new-web-loading-screen','redirect-pwa'])if(instrumentLabel(x)!==null)throw new Error('false_asset:'+x);
          if(instrumentLabel('Gold')!=='Gold'||instrumentLabel('front.Gold')!=='Gold'||instrumentLabel('USD/BRL OTC')!=='USD/BRL OTC')throw new Error('valid_asset_regression');
          console.log('VISIBLE ASSET PARSER: PASS');
          '@
          Set-Content -Path 'sentinel-visible-asset-smoke.mjs' -Value $script -Encoding UTF8
          node 'sentinel-visible-asset-smoke.mjs'
      - name: Build and install EXE
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'sentinel-trading-lab/public/downloads' | Out-Null
          Compress-Archive -Path 'sentinel-trading-lab/agent/*' -DestinationPath 'sentinel-trading-lab/public/downloads/agent_payload_v88.zip' -Force
          go build -trimpath -ldflags="-s -w -buildid=" -o 'sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe' 'sentinel-trading-lab/agent-launcher.go'
          if($LASTEXITCODE -ne 0){throw 'EXE build failed'}
          $env:SENTINEL_INSTALL_TEST='1'
          & 'sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe'
          if($LASTEXITCODE -ne 0){throw "Installer failed: $LASTEXITCODE"}
          $ok=$false
          for($i=0;$i -lt 120;$i++){
            try{
              $h=Invoke-RestMethod 'http://127.0.0.1:8788/health' -TimeoutSec 1
              if($h.ok -and $h.workerHealthy -and $h.version -eq '11.8.0'){$ok=$true;break}
            }catch{}
            Start-Sleep -Milliseconds 500
          }
          if(-not $ok){throw 'Hybrid Agent/Worker unhealthy'}
          Write-Host 'STAGING HYBRID V11.8 INSTALL: PASS'
      - name: Commit refreshed artifacts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sentinel-trading-lab/public/downloads/agent_payload_v88.zip sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){Write-Host 'Artifacts unchanged'; exit 0}
          git commit -m "build(sentinel): refresh Windows Agent V11.8"
          git push origin HEAD:sentinel-visible-asset-fix-20261006
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          try{Invoke-RestMethod 'http://127.0.0.1:8788/exit' -Method Post -TimeoutSec 2|Out-Null}catch{}
