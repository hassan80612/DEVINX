name: Sentinel 67.1 Adaptive Direct Trajectory — Isolated Comparison
on:
  push:
    branches: [sentinel-671-adaptive-direct-engine-20261011]
    paths:
      - 'sentinel-trading-lab/agent/src/core/adaptive-direct-trajectory.mjs'
      - 'tests/sentinel-671-adaptive-direct-trajectory.test.mjs'
      - 'scripts/sentinel-adaptive-real-comparison.mjs'
      - '.github/workflows/sentinel-671-adaptive-direct-lab.yml'
permissions:
  contents: read
jobs:
  compare-with-preserved-671:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert original 67.1 engine, runtime and website unchanged
        run: |
          git diff --exit-code 431bd6ffc276015a6581e0d6ba7a56c244de72e9 HEAD -- sentinel-trading-lab/src sentinel-trading-lab/public sentinel-trading-lab/agent/worker sentinel-trading-lab/agent/release.json sentinel-trading-lab/agent/package.json sentinel-trading-lab/agent/src/core/automatic-forward-model.mjs sentinel-trading-lab/agent/src/core/specialist-forward-models.mjs sentinel-trading-lab/agent/src/core/vnext-single-engine.mjs sentinel-trading-lab/agent/src/core/future-entry-schedule.mjs sentinel-trading-lab/agent/src/core/historical-forward-analogs.mjs
      - name: Chronological, no-future and paired-target contracts
        run: node --test tests/sentinel-671-adaptive-direct-trajectory.test.mjs
      - name: Download independently archived real 1s prices and verify archive checksums
        run: |
          set -euo pipefail
          mkdir -p tmp/adaptive-market-1s
          for symbol in BTCUSDT ETHUSDT; do
            for date in 2026-10-09 2026-10-10; do
              filename="$symbol-1s-$date"
              url="https://data.binance.vision/data/spot/daily/klines/$symbol/1s/$filename.zip"
              curl -fLsS --retry 3 --connect-timeout 15 --max-time 95 "$url" -o "tmp/adaptive-market-1s/$filename.zip"
              curl -fLsS --retry 3 --connect-timeout 15 --max-time 95 "$url.CHECKSUM" -o "tmp/adaptive-market-1s/$filename.zip.CHECKSUM"
              (cd tmp/adaptive-market-1s && sha256sum -c "$filename.zip.CHECKSUM")
              unzip -p "tmp/adaptive-market-1s/$filename.zip" "$filename.csv" > "tmp/adaptive-market-1s/$filename.csv"
              test "$(wc -l < "tmp/adaptive-market-1s/$filename.csv")" -gt 80000
            done
          done
      - name: Exact same-time, future entry and expiry comparison on real external prices
        run: node scripts/sentinel-adaptive-real-comparison.mjs tmp/adaptive-market-1s tmp/sentinel-adaptive-real-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-adaptive-direct-comparison
          path: tmp/sentinel-adaptive-real-result.json
