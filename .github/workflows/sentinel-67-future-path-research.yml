name: Sentinel 67 Offline Future Path Research — No Deployment
on:
  push:
    branches: [sentinel-67-future-path-research-20261011]
    paths:
      - 'sentinel-trading-lab/agent/src/core/offline-trajectory-research-67.mjs'
      - 'tests/sentinel-67-future-path-research.test.mjs'
      - '.github/workflows/sentinel-67-future-path-research.yml'
permissions:
  contents: read
jobs:
  out-of-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Assert 67 forecasting, UI, releases and deployment files are unmodified
        run: |
          set -eu
          git diff --exit-code 5c20afbef3060d00a5caa52cf0498aebff6b20c9 HEAD --             sentinel-trading-lab/src             sentinel-trading-lab/agent/release.json             sentinel-trading-lab/agent/worker             sentinel-trading-lab/agent/src/core/vnext-single-engine.mjs             sentinel-trading-lab/agent/src/core/automatic-forward-model.mjs             sentinel-trading-lab/agent/src/core/historical-forward-analogs.mjs             sentinel-trading-lab/agent/src/core/specialist-forward-models.mjs             sentinel-trading-lab/public             vercel.json
          node --check sentinel-trading-lab/agent/src/core/offline-trajectory-research-67.mjs
      - name: Compare original 67 against offline trajectory candidate on same future observations
        run: node --test tests/sentinel-67-future-path-research.test.mjs
