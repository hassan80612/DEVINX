name: Sentinel 13.9.109 stable-107 surgical Windows release validation
on:
  push:
    branches:
      - release/sentinel-139109-stable107-latefast-20261024
permissions:
  contents: read
concurrency:
  group: sentinel-139109-stable107-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Load exact published 13.9.107 gate for outcome and CPU comparison
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 36a7dcca579ff5da33b307c34c9467cfd2d16e44
          git show 36a7dcca579ff5da33b307c34c9467cfd2d16e44:sentinel-trading-lab/agent/src/core/verified-wall-exhaustion.mjs > sentinel-trading-lab/agent/src/core/verified-wall-exhaustion.baseline.mjs
      - name: Verify agent syntax
        run: |
          node --check sentinel-trading-lab/agent/src/core/verified-wall-exhaustion.mjs
          node --check sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs
      - name: Protect historical turns, short and long directions and unchanged risk decisions
        run: |
          node --test --test-concurrency=1 tests/sentinel-13996-verified-wall-exhaustion.test.mjs tests/sentinel-139109-late-chase-cpu-golden.test.mjs tests/sentinel-139107-causal-rejection-six-expiry.test.mjs tests/sentinel-13931-historical-structure.test.mjs tests/sentinel-13931-selected-forecast-structure.test.mjs tests/sentinel-13992-all-expiry-trend-reversal.test.mjs tests/sentinel-shared-pivot-guard-20261022.test.mjs tests/sentinel-oneway-pivot-guard-20261023.test.mjs tests/sentinel-13957-stage5-level-priority-and-martingale3.test.mjs tests/sentinel-13989-expiry-probability-broker-latency.test.mjs tests/sentinel-13965-overlay-throttle.test.mjs tests/sentinel-trade-audit-20261024.test.mjs tests/sentinel-139106-broker-cadence.test.mjs
      - name: Surgical change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 36a7dcca579ff5da33b307c34c9467cfd2d16e44 HEAD | grep -E '(^supabase/|^sentinel-trading-lab/(db/|migrations/|agent/src/|agent/worker/|src/app/api/|src/components/))' | grep -v '^sentinel-trading-lab/agent/src/core/verified-wall-exhaustion.mjs$' > /tmp/unsafe || true
          if test -s /tmp/unsafe; then cat /tmp/unsafe; exit 1; fi
          echo 'Only one engine risk module changed, broker and graphics intact'
      - name: Full production build and Windows binary
        run: |
          npm install --prefix sentinel-trading-lab --no-audit --no-fund --package-lock=false
          npm run build --prefix sentinel-trading-lab
      - name: Verify compiled EXE, install ZIP and live update hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('sentinel-trading-lab')
          agent=root/'agent'
          public=root/'public/downloads'
          release=json.loads((agent/'release.json').read_text())
          manifest=json.loads((public/'agent-update.json').read_text())
          assert release['version']=='13.9.109'
          assert release['build']=='13.9.109-stable107-late-fast'
          assert manifest['format']=='sentinel-agent-update-v1'
          assert manifest['version']==release['version']
          assert manifest['build']==release['build']
          payload=(public/'agent_payload_v88.zip').read_bytes()
          assert hashlib.sha256(payload).hexdigest()==manifest['zipSha256']
          exe=(public/'Sentinel-Agent-13.9.109.exe').read_bytes()
          assert exe[:2]==b'MZ' and len(exe)>1000000 and payload in exe
          assert exe==(public/'Sentinel-Agent-Windows.exe').read_bytes()
          with zipfile.ZipFile(public/'agent_payload_v88.zip') as z:
            assert z.testzip() is None
            assert json.loads(z.read('release.json'))==release
            for path in z.namelist():
              if path.endswith('/'):continue
              assert z.read(path)==(agent/path).read_bytes(),path
          print('WINDOWS CANDIDATE VERIFIED',release['version'],len(exe),len(payload))
          PY
