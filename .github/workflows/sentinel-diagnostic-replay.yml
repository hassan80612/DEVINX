name: Sentinel Offline A/B Diagnostic
on:
  push:
    branches:
      - sentinel-diagnostic-compare-20261010
permissions:
  contents: read
jobs:
  offline-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare baseline with early reversal shadow on recorded historical quotes
        run: node tests/diagnostic-compare-sentinel.mjs
