name: Sentinel 223 full production prebuild gate
# Re-run after preserving the historical 30s fast reversal and exact 223 Windows rebuild.
on:
  push:
    branches: [fix/sentinel-223-reversal-expiry-cards]
    paths: [.github/workflows/sentinel-223-full-prebuild.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-prebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exactly locked root Next dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete historical regression suite, verify EXACT Windows-tested 223 EXE and ZIP
        working-directory: sentinel-trading-lab
        run: npm run prebuild
      - name: TypeScript type check
        working-directory: sentinel-trading-lab
        run: npx tsc --noEmit
