name: Sentinel 13.9.56 stage4 preview download integrity
on:
  push:
    branches: [fix/sentinel-13956-stage4-independent-outcomes-20261019]
    paths:
      - '.github/workflows/sentinel-13956-stage4-download-verify.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public EXE and offline ZIP contain exact current Agent source
        shell: bash
        run: |
          set -euo pipefail
          HOST=https://sentinel-trading-mmh4u4671-iguassu-shop.vercel.app
          TMP="$(mktemp -d)"
          curl --fail --location --silent --show-error --max-time 50 "$HOST/downloads/agent-update.json?verify=13956" -o "$TMP/agent-update.json"
          curl --fail --location --silent --show-error --max-time 90 "$HOST/downloads/Sentinel-Agent-13.9.56.exe?verify=13956" -o "$TMP/Sentinel-Agent-13.9.56.exe"
          curl --fail --location --silent --show-error --max-time 60 "$HOST/downloads/Sentinel-Agent-13.9.56-Alternativo.zip?verify=13956" -o "$TMP/Sentinel-Agent-13.9.56-Alternativo.zip"
          python3 - "$TMP" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          tmp=Path(sys.argv[1]);root=Path('sentinel-trading-lab')
          remote=json.loads((tmp/'agent-update.json').read_text())
          local=json.loads((root/'public/downloads/agent-update.json').read_text())
          assert remote==local, (remote,local)
          assert remote['version']=='13.9.56' and remote['build']=='13.9.56-independent-stage4-expiry-evidence'
          exe=(tmp/'Sentinel-Agent-13.9.56.exe').read_bytes()
          assert exe[:2]==b'MZ' and len(exe)>1_000_000
          # The raw update ZIP is access-protected by design. Download the
          # public offline installer, whose embedded ZIP must match manifest.
          with zipfile.ZipFile(tmp/'Sentinel-Agent-13.9.56-Alternativo.zip') as archive:
            assert archive.testzip() is None
            payload=archive.read('agent_payload_v88.zip')
            assert archive.read('install-agent-v88.ps1')==(root/'public/downloads/install-agent-v88.ps1').read_bytes()
          assert hashlib.sha256(payload).hexdigest()==remote['zipSha256']
          assert payload in exe,'EXE does not embed the exact published payload'
          import io
          with zipfile.ZipFile(io.BytesIO(payload)) as agent:
            assert agent.testzip() is None
            assert json.loads(agent.read('release.json'))==json.loads((root/'agent/release.json').read_text())
            for name in agent.namelist():
              if name.endswith('/'):continue
              assert agent.read(name)==(root/'agent'/name).read_bytes(),name
          print('Verified public EXE with embedded payload:',len(exe),hashlib.sha256(exe).hexdigest())
          print('Verified public offline ZIP and manifest payload:',len(payload),hashlib.sha256(payload).hexdigest())
          PY
          curl --fail --location --silent --show-error --max-time 50 --range 0-1023 -D "$TMP/range-headers" "$HOST/downloads/Sentinel-Agent-13.9.56.exe?verify=13956" -o "$TMP/first-kib"
          python3 - "$TMP" <<'PY'
          from pathlib import Path
          import sys
          tmp=Path(sys.argv[1])
          headers=(tmp/'range-headers').read_text().lower()
          assert ' 206' in headers and 'content-range: bytes 0-1023/' in headers,headers
          assert (tmp/'first-kib').read_bytes()==(tmp/'Sentinel-Agent-13.9.56.exe').read_bytes()[:1024]
          print('Range response: 206; first 1024 bytes match downloadable EXE')
          PY
