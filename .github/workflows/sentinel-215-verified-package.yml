name: Sentinel 215 verified candidate package
on:
  push:
    branches:
      - fix/sentinel-215-causal-entries-no-timers-20261101
    paths:
      - '.github/workflows/sentinel-215-verified-package.yml'
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/package.json'
      - 'tests/sentinel-213-hybrid-family-fidelity.test.mjs'
      - 'tests/sentinel-214-six-family-exact-fidelity.test.mjs'
permissions:
  contents: write
concurrency:
  group: sentinel-215-package-candidate
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Validate all agent JS syntax
        run: |
          set -euo pipefail
          find sentinel-trading-lab/agent -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Verify version and independent causal checks
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const a=JSON.parse(readFileSync("sentinel-trading-lab/agent/release.json"));
            const p=JSON.parse(readFileSync("sentinel-trading-lab/agent/package.json"));
            const s=JSON.parse(readFileSync("sentinel-trading-lab/package.json"));
            if(a.version!=="13.9.215"||p.version!==a.version||s.version!==a.version)throw Error("version mismatch");
          '
          node --test sentinel-trading-lab/agent/test/causal-entry-quality-215.test.mjs tests/sentinel-209-distinct-opportunity.test.mjs tests/sentinel-213-hybrid-family-fidelity.test.mjs tests/sentinel-214-six-family-exact-fidelity.test.mjs tests/sentinel-189-5m-reversal-parallel.test.mjs tests/sentinel-199-expiry-last-choice.test.mjs
      - name: Build the Sentinel site using original full prebuild regression gate
        working-directory: sentinel-trading-lab
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
      - name: Package Agent, generate signed-version manifest and Windows installer
        run: |
          set -euo pipefail
          cd sentinel-trading-lab
          (cd agent && zip -qr ../public/downloads/agent_payload_v88.zip . -x 'node_modules/*' 'worker/data/*' '*.log' '.DS_Store')
          unzip -t public/downloads/agent_payload_v88.zip | tail -1
          unzip -p public/downloads/agent_payload_v88.zip package.json | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{if(JSON.parse(s).version!=="13.9.215")process.exit(1)})'
          sha="$(sha256sum public/downloads/agent_payload_v88.zip | cut -d' ' -f1)"
          SHA="$sha" node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("agent/release.json","utf8"));
            writeFileSync("public/downloads/agent-update.json",JSON.stringify({
              format:"sentinel-agent-update-v1",version:r.version,build:r.build,zipSha256:process.env.SHA
            })+"\n");
          '
          cp public/downloads/agent_payload_v88.zip public/downloads/Sentinel-Agent-13.9.215-Alternativo.zip
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -ico agent/worker/sentinel.ico -arch amd64 -o sentinel_icon.syso
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' -o public/downloads/Sentinel-Agent-Windows.exe agent-launcher.go
          rm sentinel_icon.syso
          cp public/downloads/Sentinel-Agent-Windows.exe public/downloads/sentinel-agent-windows.exe
          cp public/downloads/Sentinel-Agent-Windows.exe public/downloads/Sentinel-Agent-13.9.215.exe
          test "$(stat -c%s public/downloads/Sentinel-Agent-Windows.exe)" -gt "$(stat -c%s public/downloads/agent_payload_v88.zip)"
          test "$(sha256sum public/downloads/agent_payload_v88.zip | cut -d' ' -f1)" = "$(node -p 'require("./public/downloads/agent-update.json").zipSha256')"
      - name: Commit verified bundled payload only to candidate branch
        run: |
          set -euo pipefail
          branch=fix/sentinel-215-causal-entries-no-timers-20261101
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel-trading-lab/public/downloads/agent_payload_v88.zip
          git add sentinel-trading-lab/public/downloads/agent-update.json
          git add sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe
          git add sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe
          git add sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.215.exe
          git add sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.215-Alternativo.zip
          git diff --cached --quiet && { echo 'No packaging differences'; exit 1; }
          git commit -m 'build(sentinel): verified 13.9.215 Windows payload, exe and auto-update manifest'
          git push origin HEAD:"$branch"
