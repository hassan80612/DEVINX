name: Sentinel 13.9.17 strategy audit (NO DEPLOY)
on:
  push:
    branches: [fix/sentinel-four-strategies-guidance-20261015]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install Agent dependencies
        run: npm install --prefix sentinel-trading-lab/agent --omit=dev --no-audit --no-fund
      - name: Check public options, legacy migration, translations and strategy ownership
        run: node --test tests/sentinel-13917-public-strategies.test.mjs tests/sentinel-now-expiry-one-shot.test.mjs
      - name: Compare revised automatic to previous 13.9.16 on 30s/60s
        run: node tests/sentinel-13917-auto-ab.mjs
      - name: Typecheck PC and mobile card
        run: |
          npm install --prefix sentinel-trading-lab --no-audit --no-fund
          cd sentinel-trading-lab && npx tsc --noEmit
