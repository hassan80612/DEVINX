name: Sentinel shared-base causal direction comparison (NO DEPLOY)
on:
  push:
    branches: [research/sentinel-early-direction-no-veto-20261015]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install existing agent dependencies
        run: npm install --prefix sentinel-trading-lab/agent --omit=dev --no-audit --no-fund
      - name: Verify strategy-independent shared engine and expiry semantics
        run: node --test tests/sentinel-shared-base-regression.test.mjs tests/sentinel-now-expiry-one-shot.test.mjs tests/sentinel-1398-range-structure-regression.test.mjs
      - name: Compare chronological 30/60s shared engine with deployed baseline
        run: node tests/sentinel-early-direction-ab.mjs
