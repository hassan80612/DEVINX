name: Sentinel 120 stable cards / light broker - NO DEPLOY
on:
  push:
    branches: [fix/sentinel-120-card-broker-load-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check sentinel-trading-lab/agent/worker/executor-panel.mjs
          node --check sentinel-trading-lab/agent/worker/executor-readouts.mjs
          node --check sentinel-trading-lab/agent/worker/local-playwright-driver.mjs
          node --check sentinel-trading-lab/agent/worker/premium-overlay-controls.mjs
      - name: Visual regression and unchanged reversal / continuation admission
        run: |
          node --test --test-concurrency=1 \
            tests/sentinel-card-stability-120.test.mjs \
            tests/sentinel-continuation-room-119.test.mjs \
            tests/sentinel-118-reversal-price-authority.test.mjs \
            tests/sentinel-13996-verified-wall-exhaustion.test.mjs \
            tests/sentinel-139107-causal-rejection-six-expiry.test.mjs \
            tests/sentinel-selected-strategy-authority.test.mjs \
            tests/sentinel-13999-native-expiry-keeper.test.mjs \
            tests/sentinel-139100-broker-history-recovery.test.mjs
      - name: Install dependencies
        run: npm install --prefix sentinel-trading-lab --no-audit --no-fund --package-lock=false
      - name: Build complete web and real Windows Agent
        run: npm run build --prefix sentinel-trading-lab
      - name: Check packaged Windows Agent and signed-by-hash update payload
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('sentinel-trading-lab')
          release=json.loads((root/'agent/release.json').read_text())
          assert release['version']=='13.9.120'
          assert release['build']=='13.9.120-stable-live-cards-broker-lightweight'
          dl=root/'public/downloads'
          manifest=json.loads((dl/'agent-update.json').read_text())
          assert manifest['version']==release['version'] and manifest['build']==release['build']
          payload=(dl/'agent_payload_v88.zip').read_bytes()
          assert hashlib.sha256(payload).hexdigest()==manifest['zipSha256']
          exe=(dl/'Sentinel-Agent-13.9.120.exe').read_bytes()
          assert exe[:2]==b'MZ' and len(exe)>1_000_000 and payload in exe
          assert exe==(dl/'Sentinel-Agent-Windows.exe').read_bytes()
          with zipfile.ZipFile(dl/'agent_payload_v88.zip') as z:
            assert z.testzip() is None
            assert json.loads(z.read('release.json'))==release
            for name in z.namelist():
              if name.endswith('/'):continue
              assert z.read(name)==(root/'agent'/name).read_bytes(),name
          print('SENTINEL 120 VERIFIED',len(exe),manifest['zipSha256'])
          PY
