name: Sentinel 13.9.118 causal reversal proof NO DEPLOY
on:
  push:
    branches:
      - fix/sentinel-139118-first-live-reversal-proof-20261025
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test first real reversal and stale confirmation in seven expiries
        run: |
          node --check sentinel-trading-lab/agent/src/core/observed-level-sequence.mjs
          node --test tests/sentinel-139118-live-reversal-first-proof.test.mjs
      - name: Preserve current confirmed turns and important historical levels
        run: |
          node --test --test-concurrency=1 tests/sentinel-current-reversal-20261025.test.mjs tests/sentinel-directional-level-context-20261025.test.mjs tests/sentinel-level-roles-20261025.test.mjs tests/sentinel-13931-historical-structure.test.mjs tests/sentinel-13992-all-expiry-trend-reversal.test.mjs tests/sentinel-now-expiry-one-shot.test.mjs tests/sentinel-13989-expiry-probability-broker-latency.test.mjs
      - name: Compare old and new decisions against identical recorded quotes, all 7 expiries
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 99303b4ddb061dc869925977369d6daee06b60d5
          node research/sentinel-118-paired-live-reversal.mjs
      - name: Audit modifications only in the observed quote structure analyzer
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin 99303b4ddb061dc869925977369d6daee06b60d5
          git diff --name-only 99303b4ddb061dc869925977369d6daee06b60d5 HEAD | grep -E '^sentinel-trading-lab/(agent/|src/)' | grep -v '^sentinel-trading-lab/agent/src/core/observed-level-sequence.mjs$' > /tmp/changed-other-areas || true
          if test -s /tmp/changed-other-areas; then cat /tmp/changed-other-areas; exit 1; fi
          echo 'Reversal analyzer only; no broker expiry, execution, card, stop or overlay edits'
