name: Sentinel 231 - blue market phase only (no decision changes)
on:
  push:
    branches:
      - fix/sentinel-231-blue-phase-separate-main-20261102
    paths:
      - '.github/workflows/sentinel-231-blue-only-safety.yml'
      - 'sentinel-trading-lab/agent/worker/live-market-readout-229.mjs'
      - 'sentinel-trading-lab/agent/worker/local-playwright-driver.mjs'
      - 'tests/sentinel-231-blue-readout-separation.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-visual-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify new visual examples, old blue cases and expiry behavior
        run: |
          node --test tests/sentinel-231-blue-readout-separation.test.mjs tests/sentinel-229-blue-live-market-phase.test.mjs tests/sentinel-230-startup-and-download.test.mjs tests/sentinel-221-expiry-native-durable.test.mjs tests/sentinel-199-expiry-last-choice.test.mjs
      - name: Full prebuild and TypeScript compile
        working-directory: sentinel-trading-lab
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run prebuild
          npx tsc --noEmit --pretty false
      - name: Verify all other trading and expiry core files byte-identical to 230
        run: |
          git fetch --depth=1 origin fix/sentinel-221-github-direct-no-vercel-hop-20261102
          git diff --exit-code FETCH_HEAD -- sentinel-trading-lab/agent/src/core/runtime.mjs sentinel-trading-lab/agent/worker/index.mjs sentinel-trading-lab/agent/worker/signal-executor.mjs sentinel-trading-lab/agent/worker/broker-native-expiry-keeper.mjs sentinel-trading-lab/agent/worker/native-expiry-resume-228.mjs sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs
