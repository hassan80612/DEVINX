name: Sentinel V12 clean artifact build

on:
  pull_request:
    branches: [main]
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/agent-launcher.go'
      - 'sentinel-trading-lab/public/downloads/install-agent-v88.ps1'
      - 'sentinel-trading-lab/src/app/page.tsx'
      - '.github/workflows/sentinel-v12-build.yml'

permissions:
  contents: write

jobs:
  build-artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentinel-v12-clean-restore-20261006
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Validate V12 restored source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem 'sentinel-trading-lab/agent' -Recurse -Filter '*.mjs' | ForEach-Object {
            & node --check $_.FullName
            if($LASTEXITCODE -ne 0){throw "Syntax failed: $($_.FullName)"}
          }
          $worker=Get-Content 'sentinel-trading-lab/agent/worker/index.mjs' -Raw
          if($worker -notmatch "VERSION='12\.0\.0'"){throw 'V12 worker version missing'}
          $page=Get-Content 'sentinel-trading-lab/src/app/page.tsx' -Raw
          if($page -notmatch 'Baixar Agent EXE V12'){throw 'V12 UI label missing'}
          Write-Host 'V12 CLEAN SOURCE: PASS'

      - name: Build V12 artifacts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'sentinel-trading-lab/public/downloads' | Out-Null
          Compress-Archive -Path 'sentinel-trading-lab/agent/*' -DestinationPath 'sentinel-trading-lab/public/downloads/agent_payload_v88.zip' -Force
          go build -trimpath -ldflags="-s -w -buildid=" -o 'sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe' 'sentinel-trading-lab/agent-launcher.go'
          if($LASTEXITCODE -ne 0){throw 'EXE build failed'}
          if(-not (Test-Path 'sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe')){throw 'EXE missing'}
          if(-not (Test-Path 'sentinel-trading-lab/public/downloads/agent_payload_v88.zip')){throw 'payload missing'}
          Write-Host 'V12 ARTIFACT BUILD: PASS'

      - name: Commit V12 artifacts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sentinel-trading-lab/public/downloads/agent_payload_v88.zip sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){Write-Host 'Artifacts unchanged'; exit 0}
          git commit -m "build(sentinel): publish clean Windows Agent V12"
          git pull --rebase origin sentinel-v12-clean-restore-20261006
          git push origin HEAD:sentinel-v12-clean-restore-20261006
