name: Sentinel 237 First-wave Reversal Regression
on:
  push:
    branches:
      - fix/sentinel-237-continuation-wall-arbitration-20261103
    paths:
      - 'sentinel-trading-lab/agent/src/core/first-wave-counterturn-237.mjs'
      - 'sentinel-trading-lab/agent/src/core/now-opportunity-engine.mjs'
      - 'sentinel-trading-lab/agent/src/core/shared-pivot-guard.mjs'
      - 'tests/sentinel-237-first-wave-arbitration.test.mjs'
      - '.github/workflows/sentinel-237-first-wave-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run original protections and first-wave inversion tests
        run: |
          set -euo pipefail
          node --check sentinel-trading-lab/agent/src/core/first-wave-counterturn-237.mjs
          node --test tests/sentinel-237-first-wave-arbitration.test.mjs tests/sentinel-236-multilevel-reversal-recognition.test.mjs tests/sentinel-235-first-turn-before-candle-flip.test.mjs tests/sentinel-227-impulse-reversal-and-visuals.test.mjs tests/sentinel-221-expiry-native-durable.test.mjs
