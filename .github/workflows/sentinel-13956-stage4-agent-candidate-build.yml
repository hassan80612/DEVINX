name: Sentinel 13.9.56 stage4 paired evidence build - no production
on:
  push:
    branches:
      - fix/sentinel-13956-stage4-independent-outcomes-20261019
    paths:
      - 'sentinel-trading-lab/agent/**'
      - 'sentinel-trading-lab/src/components/BotControl.tsx'
      - 'sentinel-trading-lab/agent/worker/executor-panel.mjs'
      - 'tests/**'
      - '.github/workflows/sentinel-13956-stage4-agent-candidate-build.yml'
permissions:
  contents: write
concurrency:
  group: sentinel-13956-stage4-agent-build
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Check every Agent module and bot close/timing regressions
        shell: bash
        run: |
          set -euo pipefail
          find sentinel-trading-lab/agent -name '*.mjs' -type f -print0 | xargs -0 -n1 node --check
          node --test tests/sentinel-13956-stage4-independent-outcomes.test.mjs tests/sentinel-13955-session-and-calculation.test.mjs tests/sentinel-13954-bounded-settlement-recovery.test.mjs tests/sentinel-13953-safe-restart.test.mjs tests/sentinel-13953-broker-ack-timeout.test.mjs tests/sentinel-13952-continuous-bot.test.mjs tests/sentinel-13951-click-martingale.test.mjs tests/sentinel-nested-settlement-balance-20261018.test.mjs
      - name: Install website build dependencies
        run: npm install --prefix sentinel-trading-lab --no-audit --no-fund --package-lock=false
      - name: Full website prebuild and Next.js build
        run: npm run build --prefix sentinel-trading-lab
      - name: Validate the exact Next-built Agent EXE and alternate package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          root=Path('sentinel-trading-lab')
          agent=root/'agent'
          dl=root/'public/downloads'
          release=json.loads((agent/'release.json').read_text())
          assert release['version']=='13.9.56' and release['build']=='13.9.56-independent-stage4-expiry-evidence'
          manifest=json.loads((dl/'agent-update.json').read_text())
          payload=(dl/'agent_payload_v88.zip').read_bytes()
          exe=(dl/'Sentinel-Agent-13.9.56.exe').read_bytes()
          assert manifest['version']==release['version'] and manifest['build']==release['build']
          assert manifest['zipSha256']==hashlib.sha256(payload).hexdigest()
          assert exe[:2]==b'MZ' and len(exe)>1_000_000 and payload in exe
          assert exe==(dl/'Sentinel-Agent-Windows.exe').read_bytes()
          assert exe==(dl/'sentinel-agent-windows.exe').read_bytes()
          with zipfile.ZipFile(dl/'agent_payload_v88.zip') as z:
            assert z.testzip() is None
            assert json.loads(z.read('release.json'))==release
            for name in z.namelist():
              if name.endswith('/'):continue
              assert z.read(name)==(agent/name).read_bytes(),name
          with zipfile.ZipFile(dl/'Sentinel-Agent-13.9.56-Alternativo.zip') as z:
            assert z.testzip() is None
            assert z.read('agent_payload_v88.zip')==payload
            assert z.read('install-agent-v88.ps1')==(dl/'install-agent-v88.ps1').read_bytes()
          print(json.dumps({'version':release['version'],'exeBytes':len(exe),'exeSha256':hashlib.sha256(exe).hexdigest(),'payloadBytes':len(payload),'payloadSha256':manifest['zipSha256']}))
          PY
      - name: Commit exact production-builder artifacts ONLY to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.56.exe sentinel-trading-lab/public/downloads/Sentinel-Agent-13.9.56-Alternativo.zip sentinel-trading-lab/public/downloads/Sentinel-Agent-Windows.exe sentinel-trading-lab/public/downloads/sentinel-agent-windows.exe sentinel-trading-lab/public/downloads/agent_payload_v88.zip sentinel-trading-lab/public/downloads/agent-update.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(sentinel): verified 13.9.56 Agent - candidate branch only'
            git push origin HEAD:fix/sentinel-13956-stage4-independent-outcomes-20261019
          fi
